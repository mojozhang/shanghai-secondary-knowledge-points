<style>
:root{--ink:#1c1c1e;--sub:#6b6b70;--line:#e4e4e8;--accent:#0b6b5b;--bg:#f6f7f4;--soft:#eef4f1}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.7 -apple-system,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;display:flex;flex-direction:column;min-height:100vh}
header{background:#fff;border-bottom:1px solid var(--line);padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
header h1{font-size:17px;margin:0;color:var(--accent)}
.stat{color:var(--sub);font-size:12px}
.spacer{flex:1}
input[type=search],select{border:1px solid var(--line);border-radius:8px;padding:6px 10px;font-size:13px;background:#fff}
.tabs{display:flex;gap:6px}
.tab{border:1px solid var(--line);background:#fff;border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer;color:#444}
.tab.on{background:var(--accent);color:#fff;border-color:var(--accent)}
main{flex:1;display:flex;min-height:0}
aside{width:290px;background:#fff;border-right:1px solid var(--line);overflow:auto;padding:12px}
.tree-book{font-size:12px;color:var(--accent);font-weight:700;margin:12px 0 4px;padding-left:4px}
.item{padding:6px 8px;border-radius:8px;cursor:pointer;font-size:13px;display:flex;gap:8px;align-items:baseline}
.item:hover{background:var(--soft)}
.item.on{background:var(--soft);box-shadow:inset 3px 0 0 var(--accent)}
.item .id{color:var(--sub);font-size:11px;min-width:44px}
#content{flex:1;overflow:auto;padding:22px 26px}
#vocab{flex:1;overflow:auto;padding:18px 22px;display:none}
.card{max-width:860px;margin:0 auto;background:#fff;border:1px solid var(--line);border-radius:14px;padding:26px 30px}
.card h2{margin:0 0 4px;color:var(--accent);font-size:21px}
.card h3{margin:20px 0 6px;font-size:15px;color:#14532d;border-left:3px solid var(--accent);padding-left:8px}
.card p,.card li{font-size:13.6px;line-height:1.8}
.card table{border-collapse:collapse;width:100%;font-size:12.8px;margin:8px 0}
.card th,.card td{border:1px solid var(--line);padding:5px 8px;vertical-align:top}
.card th{background:var(--soft)}
.card blockquote{margin:8px 0;background:var(--soft);border-left:3px solid var(--accent);padding:6px 12px;color:#333}
.card strong{color:#0f3d33}
.placeholder{color:var(--sub);text-align:center;margin-top:80px}
.vbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:10px}
.vstat{font-size:13px;color:var(--sub)}
.vtable{width:100%;border-collapse:collapse;font-size:13px;background:#fff}
.vtable th{background:var(--soft);position:sticky;top:0;z-index:2;font-size:12px;color:#33584c;text-align:left;padding:6px 8px;border-bottom:1px solid #cfdcd6}
.vtable td{padding:5px 8px;border-bottom:1px dotted #d9d9d9;vertical-align:middle}
.vtable tr:hover td{background:#fafcfb}
.w-en b{font-family:Georgia,"Times New Roman",serif;font-size:14px}
.pos{color:#8a8a8a;font-size:11px}
.bx{display:inline-block;width:15px;height:15px;border:1px solid #9aa;border-radius:3px;margin-right:4px;cursor:pointer;vertical-align:-2px;background:#fff}
.bx.on{background:var(--accent);border-color:var(--accent);position:relative}
.bx.on::after{content:"";position:absolute;left:4px;top:1px;width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg)}
.hide-cn .cn{visibility:hidden}
.hide-en .w-en{visibility:hidden}
.tag{font-size:10px;color:#b45309;margin-left:6px}
footer{border-top:1px solid var(--line);background:#fff;padding:6px 16px;font-size:12px;color:var(--sub);display:flex;gap:18px}
#print{display:none}
@media print{
  @page{size:A4;margin:12mm 12mm}
  body{display:block;background:#fff}
  header,aside,#content,#vocab,footer{display:none!important}
  #print{display:block!important}
  .pbook{page-break-before:always}
  .pbook:first-child{page-break-before:auto}
  .pbook h1{font-size:20pt;color:#0b6b5b;margin:0 0 6mm}
  .pcard{page-break-before:always}
  .pcard h2{font-size:14pt;color:#0b6b5b;margin:0 0 2mm;border-bottom:1px solid #0b6b5b;padding-bottom:1mm}
  .pcard h3{font-size:10.5pt;margin:4mm 0 1mm;color:#14532d}
  .pcard p,.pcard li{font-size:9.2pt;line-height:1.55;margin:1mm 0}
  .pcard table{font-size:8.6pt;margin:2mm 0}
  .pcard th,.pcard td{padding:1.2mm 1.6mm}
  .pcard blockquote{margin:2mm 0;padding:1mm 3mm;background:#f4f7f5}
  .pcard ul,.pcard ol{margin:1mm 0 1mm 5mm}
}
</style></head>

<script>const DATA = {"cards": [{"id": "E-1.1", "name": "Our world", "book": "必修第一册", "guess": "\"I'm very exciting about the trip.\" 这句话对吗？", "html": "<p><strong>⚡ 先猜</strong>：\"I'm very exciting about the trip.\" 这句话对吗？</p>\n<h3>30 秒概述</h3>\n<p>本单元围绕\"我们生活的世界\"展开：读一篇普通人一天的生活（Life in a day），学<strong>现在进行时的被动语态</strong>（am/is/are being done），写一封介绍新学校生活的<strong>非正式信件</strong>。核心词集中在日常作息、数字生活与个人目标上。</p>\n<h3>30 秒自评</h3>\n<ol>\n<li>digital 的意思是\"数字的\"还是\"手指的\"？</li>\n<li>\"The classroom is being cleaned.\" 用的是什么语态？</li>\n<li>\"on schedule\" 的意思是\"按时\"还是\"在日程表上\"？</li>\n</ol>\n<blockquote>\n<p><strong>答案</strong>：1. 数字的（finger 才是\"手指\"）　2. 现在进行时的被动语态　3. 按时</p>\n</blockquote>\n<h3>🔑 核心词汇（10）</h3>\n<ul>\n<li><strong>digital</strong> adj. 数字的：a <strong>digital</strong> time capsule 数字时间胶囊；We live in a <strong>digital</strong> world.</li>\n<li><strong>typical</strong> adj. 典型的：a <strong>typical</strong> day 典型的一天；It is <strong>typical</strong> of him to be late.</li>\n<li><strong>routine</strong> n. 常规；惯例：daily <strong>routine</strong> 日常安排；My <strong>routine</strong> changes on Fridays.</li>\n<li><strong>scene</strong> n. 场面；现场：a familiar <strong>scene</strong> 熟悉的场景；the <strong>scene</strong> of the accident 事故现场</li>\n<li><strong>earn</strong> v. 挣得；赢得：<strong>earn</strong> a living 谋生；<strong>earn</strong> respect 赢得尊重</li>\n<li><strong>goal</strong> n. 目标；进球：set a <strong>goal</strong> 设定目标；score a <strong>goal</strong> 进一球</li>\n<li><strong>partner</strong> n. 搭档；伙伴：work with a <strong>partner</strong> 和搭档合作；a business <strong>partner</strong> 生意伙伴</li>\n<li><strong>improve</strong> v. 改进；提高：<strong>improve</strong> your English 提高英语；<strong>improve</strong> on the design 改进设计</li>\n<li><strong>challenge</strong> n./v. 挑战；质疑：face a <strong>challenge</strong> 面对挑战；<strong>challenge</strong> the result 质疑结果</li>\n<li><strong>inspire</strong> v. 激励；启发：<strong>inspire</strong> somebody to do 激励某人做；an <strong>inspiring</strong> story 鼓舞人心的故事</li>\n</ul>\n<h3>🧩 短语与搭配（8）</h3>\n<table>\n<thead>\n<tr>\n<th>短语</th>\n<th>意思</th>\n<th>例句</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>on schedule</td>\n<td>按时</td>\n<td>The project finished <strong>on schedule</strong>.</td>\n</tr>\n<tr>\n<td>be related to</td>\n<td>与……有关</td>\n<td>The two events are closely <strong>related to</strong> each other.</td>\n</tr>\n<tr>\n<td>respond to</td>\n<td>回应</td>\n<td>She <strong>responded to</strong> my email at once.</td>\n</tr>\n<tr>\n<td>a sense of freedom</td>\n<td>自由感</td>\n<td>Living alone gave him <strong>a sense of freedom</strong>.</td>\n</tr>\n<tr>\n<td>at midnight</td>\n<td>在午夜</td>\n<td>The clock struck <strong>at midnight</strong>.</td>\n</tr>\n<tr>\n<td>earn a living</td>\n<td>谋生</td>\n<td>He <strong>earns a living</strong> as a photographer.</td>\n</tr>\n<tr>\n<td>improve on</td>\n<td>对……加以改进</td>\n<td>Can you <strong>improve on</strong> this plan?</td>\n</tr>\n<tr>\n<td>inspire somebody to do</td>\n<td>激励某人做</td>\n<td>The talk <strong>inspired</strong> us <strong>to</strong> start a club.</td>\n</tr>\n</tbody>\n</table>\n<h3>📐 语法：现在进行时的被动语态</h3>\n<p><strong>结构</strong>：am / is / are <strong>being</strong> + 过去分词</p>\n<table>\n<thead>\n<tr>\n<th>主语</th>\n<th>形式</th>\n<th>例句</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>I</td>\n<td>am being + done</td>\n<td>I <strong>am being</strong> watched.</td>\n</tr>\n<tr>\n<td>he / she / it</td>\n<td>is being + done</td>\n<td>The road <strong>is being</strong> repaired.</td>\n</tr>\n<tr>\n<td>we / they</td>\n<td>are being + done</td>\n<td>The trees <strong>are being</strong> planted.</td>\n</tr>\n</tbody>\n</table>\n<p><strong>用法</strong>：表示\"此刻正在被……\"，强调动作正在进行且主语是承受者。</p>\n<p><strong>与一般现在时被动的区别</strong>：\n- The classroom <strong>is cleaned</strong> every day.（每天都被打扫——习惯）\n- The classroom <strong>is being cleaned</strong> now.（此刻正在被打扫——进行）</p>\n<ol>\n<li>漏掉 being：The road is repaired now.（×，缺\"正在\"）</li>\n<li>being 后误用动词原形：is being repair（×）</li>\n<li>\n<p>状态动词一般不用进行时：is being belonged to（×）</p>\n</li>\n<li>\n<p>The bridge <strong><em>_</em></strong>_ (build) at the moment. → <strong>is being built</strong></p>\n</li>\n<li>Look! The car <strong><em>_</em></strong>_ (wash) by my father. → <strong>is being washed</strong></li>\n<li>改错：The house is being paint by workers. → <strong>painted</strong></li>\n</ol>\n<h3>✍️ 写作：非正式信件（informal letter）</h3>\n<p><strong>结构</strong>：称呼 → 开头问候 → 主体（2 段：学校生活 + 感受）→ 结尾期待回信 → 署名</p>\n<ol>\n<li><strong>How's it going?</strong> 最近怎么样？</li>\n<li><strong>I've been here for a week, and I'm slowly getting used to...</strong> 我来这儿一周了，正慢慢适应……</li>\n<li><strong>The thing I like most is...</strong> 我最喜欢的是……</li>\n<li><strong>It's a bit hard to..., but I'm working on it.</strong> ……有点难，但我正在努力。</li>\n<li><strong>Write back soon and tell me about...</strong> 快回信，跟我说说……</li>\n</ol>\n<h3>📖 阅读技能：找主题句</h3>\n<p>说明文/记叙文的主题句常在<strong>段首或段尾</strong>。先看首句，再看末句；如果首句是细节，末句往往总结。练习时用笔划出每段第一句，读完再回看是否覆盖全段。</p>\n<h3>例题 1 · L1 词汇</h3>\n<p>用方框中的词填空：digital / typical / routine / earn / challenge</p>\n<ol>\n<li>It is a ______ day for a student: classes, lunch, homework.</li>\n<li>Many people ______ a living by writing.</li>\n<li>Learning a new language is a real ______.</li>\n<li>My morning ______ starts with a run.</li>\n<li>We live in a ______ age.</li>\n</ol>\n<p><strong>解析</strong>：1. typical　2. earn　3. challenge　4. routine　5. digital</p>\n<p><strong>💥 陷阱</strong>：第 1 题容易填 digital（\"数字的一天\"），但句意是\"典型的一天\"。</p>\n<p><strong>变式</strong>：用 inspire 造句，表达\"这本书激励我学英语\"。（The book inspired me to learn English.）</p>\n<h3>例题 2 · L2 语法</h3>\n<p>把下列句子改为现在进行时的被动语态：\n1. They are building a new library.\n2. Someone is repairing my bike.\n3. The workers are planting trees.</p>\n<p><strong>解析</strong>：\n1. A new library <strong>is being built</strong>.\n2. My bike <strong>is being repaired</strong>.\n3. Trees <strong>are being planted</strong> by the workers.</p>\n<p><strong>💥 陷阱</strong>：第 1 题漏掉 being，写成 is built，变成\"一般现在时被动\"。</p>\n<p><strong>变式</strong>：把 \"The room is being cleaned.\" 改为一般疑问句。（Is the room being cleaned?）</p>\n<h3>例题 3 · L3 翻译</h3>\n<p>翻译下列句子：\n1. 这所学校正在被重建，所以我们暂时在临时教室里上课。\n2. 让我印象最深的是这里的人：他们总是乐于回应别人的求助。\n3. 虽然日程很紧，我还是设法按时完成了项目。</p>\n<p><strong>参考译文</strong>：\n1. The school <strong>is being rebuilt</strong>, so we are having classes in temporary classrooms for now.\n2. What <strong>impressed</strong> me most was the people here: they are always ready to <strong>respond to</strong> others' requests for help.\n3. Although the <strong>schedule</strong> was tight, I managed to finish the project <strong>on schedule</strong>.</p>\n<p><strong>采分点</strong>：① 现在进行时被动 is being rebuilt；② impress 的用法 / respond to；③ on schedule 与 although 引导的让步状语从句。</p>\n<p><strong>💥 陷阱</strong>：第 1 句写成 is rebuilt（缺\"正在\"）；第 3 句把 on schedule 写成 in schedule。</p>\n<p><strong>变式</strong>：把第 2 句改为强调句：It was the people here that impressed me most.</p>\n<h3>⏱️ 限时挑战（60 秒）</h3>\n<p>① digital 的反义词（提示：纸质）？② \"is being discussed\" 的中文意思？③ earn a living 的意思？</p>\n<blockquote>\n<p>答案：① paper / printed　② 正在被讨论　③ 谋生</p>\n</blockquote>\n<h3>✅ 接下来做什么</h3>\n<ul>\n<li><strong>3 道全对</strong> → 进入 E-1.2；词汇直接跳到\"本单元必背 10 词\"逐词默写。</li>\n<li><strong>对 2 道</strong> → 重读\"语法\"与\"写作\"两节，再做例题 2、3。</li>\n<li><strong>对 0–1 道</strong> → 从\"核心词汇\"顺序读到例题 3，再背词表。</li>\n</ul>\n<blockquote>\n<p><strong>过关线</strong>：期中做到例题 2｜期末做到例题 3 和变式。</p>\n</blockquote>\n<h3>🧠 本单元必背 10 词</h3>\n<p>digital, typical, routine, scene, earn, goal, partner, improve, challenge, inspire</p>"}, {"id": "E-1.2", "name": "Places", "book": "必修第一册", "guess": "\"I would visit the museum the next day.\" 里的 would 表示\"过去将来\"还是\"客气\"？", "html": "<p><strong>⚡ 先猜</strong>：\"I would visit the museum the next day.\" 里的 would 表示\"过去将来\"还是\"客气\"？</p>\n<h3>30 秒概述</h3>\n<p>本单元以\"地方\"为主题，读一篇介绍历史名城的文章（Where history comes alive），学<strong>过去将来时</strong>（would do / was going to do / was about to do），写一篇<strong>旅行博客</strong>。词汇集中在旅行、历史遗迹与个人感受。</p>\n<h3>30 秒自评</h3>\n<ol>\n<li>historic 和 historical 都能表示\"历史的\"吗？</li>\n<li>\"He said he would come.\" 中的 would 表示什么？</li>\n<li>\"be about to do\" 的意思是\"即将做\"还是\"打算做\"？</li>\n</ol>\n<blockquote>\n<p><strong>答案</strong>：1. 能，但 historic 强调\"有历史意义的\"，historical 强调\"与历史有关的\"　2. 过去将来（站在过去看将来）　3. 即将做（通常不与具体时间状语连用）</p>\n</blockquote>\n<h3>🔑 核心词汇（10）</h3>\n<ul>\n<li><strong>destination</strong> n. 目的地：reach the <strong>destination</strong> 到达目的地；a tourist <strong>destination</strong> 旅游胜地</li>\n<li><strong>historic</strong> adj. 有历史意义的：a <strong>historic</strong> site 历史遗址；a <strong>historic</strong> moment 历史性时刻</li>\n<li><strong>former</strong> adj. 以前的：the <strong>former</strong> capital 旧都；a <strong>former</strong> teacher 以前的老师</li>\n<li><strong>view</strong> n. 景色；观点：a wonderful <strong>view</strong> 美景；in my <strong>view</strong> 在我看来</li>\n<li><strong>memory</strong> n. 记忆：childhood <strong>memories</strong> 童年记忆；in <strong>memory</strong> of 为了纪念</li>\n<li><strong>contribute</strong> v. 贡献；促成：<strong>contribute</strong> to 有助于；<strong>contribute</strong> money 捐钱</li>\n<li><strong>opportunity</strong> n. 机会：a golden <strong>opportunity</strong> 绝佳机会；take the <strong>opportunity</strong> to do 趁机做</li>\n<li><strong>transport</strong> n./v. 交通；运输：public <strong>transport</strong> 公共交通；<strong>transport</strong> goods 运输货物</li>\n<li><strong>disappoint</strong> v. 使失望：be <strong>disappointed</strong> at 对……失望；a <strong>disappointing</strong> result 令人失望的结果</li>\n<li><strong>adventure</strong> n. 冒险：an <strong>adventure</strong> story 冒险故事；go on an <strong>adventure</strong> 去冒险</li>\n</ul>\n<h3>🧩 短语与搭配（8）</h3>\n<table>\n<thead>\n<tr>\n<th>短语</th>\n<th>意思</th>\n<th>例句</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>be famous for</td>\n<td>因……而闻名</td>\n<td>The city <strong>is famous for</strong> its old bridges.</td>\n</tr>\n<tr>\n<td>date back to</td>\n<td>追溯到</td>\n<td>The temple <strong>dates back to</strong> the Tang Dynasty.</td>\n</tr>\n<tr>\n<td>in memory of</td>\n<td>为了纪念</td>\n<td>The statue was built <strong>in memory of</strong> the poet.</td>\n</tr>\n<tr>\n<td>contribute to</td>\n<td>有助于；促成</td>\n<td>Tourism <strong>contributes to</strong> the local economy.</td>\n</tr>\n<tr>\n<td>take the opportunity to do</td>\n<td>趁机做</td>\n<td>We <strong>took the opportunity to</strong> visit the old town.</td>\n</tr>\n<tr>\n<td>be worth visiting</td>\n<td>值得参观</td>\n<td>The museum <strong>is worth visiting</strong>.</td>\n</tr>\n<tr>\n<td>get around</td>\n<td>四处走动</td>\n<td>It is easy to <strong>get around</strong> the city by bike.</td>\n</tr>\n<tr>\n<td>in the distance</td>\n<td>在远处</td>\n<td>We saw a tower <strong>in the distance</strong>.</td>\n</tr>\n</tbody>\n</table>\n<h3>📐 语法：过去将来时</h3>\n<p><strong>结构</strong>：would + 动词原形；was / were going to + 动词原形；was / were about to + 动词原形</p>\n<table>\n<thead>\n<tr>\n<th>形式</th>\n<th>含义</th>\n<th>例句</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>would do</td>\n<td>站在过去看将来</td>\n<td>He said he <strong>would visit</strong> the site.</td>\n</tr>\n<tr>\n<td>was/were going to do</td>\n<td>过去打算做</td>\n<td>We <strong>were going to</strong> leave at six.</td>\n</tr>\n<tr>\n<td>was/were about to do</td>\n<td>过去即将做</td>\n<td>She <strong>was about to</strong> speak when the bell rang.</td>\n</tr>\n</tbody>\n</table>\n<p><strong>用法</strong>：常用于宾语从句（said, thought, knew 之后）或叙述过去某时之后将发生的事。</p>\n<ol>\n<li>与一般将来时混用：He said he will come.（×，主句过去时，从句用 would）</li>\n<li>was about to 后加具体时间：was about to leave at six（×，about to 强调\"马上\"，不加具体时间）</li>\n<li>\n<p>would 与 used to 混淆：would 只表\"过去常做（带感情）\"，used to 强调\"现在不做了\"</p>\n</li>\n<li>\n<p>He told me he <strong><em>_</em></strong>_ (come) back the next week. → <strong>would come</strong></p>\n</li>\n<li>They <strong><em>_</em></strong>_ (leave) when it began to rain. → <strong>were about to leave</strong></li>\n<li>改错：She said she is going to visit the museum. → <strong>was going to</strong></li>\n</ol>\n<h3>✍️ 写作：旅行博客（travel blog）</h3>\n<p><strong>结构</strong>：吸引人的标题 → 时间地点 → 2–3 个亮点（用过去时叙事）→ 实用建议 → 一句感受</p>\n<ol>\n<li><strong>If you ever get the chance, don't miss...</strong> 有机会千万别错过……</li>\n<li><strong>The moment I stepped into..., I knew...</strong> 我一走进……就知道……</li>\n<li><strong>What impressed me most was...</strong> 最让我印象深刻的是……</li>\n<li><strong>A word of advice: ...</strong> 一句建议：……</li>\n<li><strong>I left with a memory I will keep for ever.</strong> 我带着一段永远珍藏的记忆离开。</li>\n</ol>\n<h3>📖 阅读技能：扫读找细节（scanning）</h3>\n<p>先看题干中的<strong>关键词</strong>（人名、地名、数字、时间），再回到原文快速\"扫\"这些词，不必逐句读。找到关键词后，读它前后各一句，答案通常就在附近。</p>\n<h3>例题 1 · L1 词汇</h3>\n<p>用方框中的词填空：destination / former / view / opportunity / transport</p>\n<ol>\n<li>The ______ capital of the country is now a quiet town.</li>\n<li>Public ______ in this city is cheap and clean.</li>\n<li>From the top of the hill, the ______ is amazing.</li>\n<li>Don't miss the ______ to try local food.</li>\n<li>Our final ______ is a small village by the sea.</li>\n</ol>\n<p><strong>解析</strong>：1. former　2. transport　3. view　4. opportunity　5. destination</p>\n<p><strong>💥 陷阱</strong>：第 1 题容易填 historic，但\"旧都\"强调\"以前的\"，用 former。</p>\n<p><strong>变式</strong>：用 contribute to 造句，表达\"旅游业促进了这座城市的发展\"。→ Tourism contributes to the development of the city.</p>\n<h3>例题 2 · L2 语法</h3>\n<p>把下列句子改为过去将来时（主句用过去时）：\n1. She says she will visit the old town.\n2. They are going to take the train.\n3. We are about to leave.</p>\n<p><strong>解析</strong>：\n1. She said she <strong>would visit</strong> the old town.\n2. They said they <strong>were going to take</strong> the train.\n3. We <strong>were about to leave</strong> when he called.</p>\n<p><strong>💥 陷阱</strong>：第 2 题把 are going to 只改成 was going to，忘记主谓一致（they → were）。</p>\n<p><strong>变式</strong>：把 \"He told me he would come back soon.\" 改为直接引语。→ He said to me, \"I will come back soon.\"</p>\n<h3>例题 3 · L3 翻译</h3>\n<p>翻译下列句子：\n1. 这座桥可以追溯到明朝，每年吸引数百万游客。\n2. 我们本来打算第二天去博物馆，但一场大雨使我们改变了计划。\n3. 在我看来，旅行的意义不在于目的地，而在于沿途的发现。</p>\n<p><strong>参考译文</strong>：\n1. The bridge <strong>dates back to</strong> the Ming Dynasty and attracts <strong>millions of</strong> visitors every year.\n2. We <strong>were going to</strong> visit the museum the next day, but a heavy rain made us change our plan.\n3. <strong>In my view</strong>, the meaning of travel lies not in the <strong>destination</strong> but in the discoveries along the way.</p>\n<p><strong>采分点</strong>：① date back to + millions of；② were going to + make somebody do；③ in my view + not...but...</p>\n<p><strong>💥 陷阱</strong>：第 1 句 date back to 用成被动（is dated back to）；第 3 句 not...but... 结构不完整。</p>\n<p><strong>变式</strong>：把第 1 句改为定语从句：The bridge, which dates back to the Ming Dynasty, attracts millions of visitors every year.</p>\n<h3>⏱️ 限时挑战（60 秒）</h3>\n<p>① \"historic site\" 的意思？② \"be about to do\" 能否与 at six 连用？③ \"in memory of\" 的意思？</p>\n<blockquote>\n<p>答案：① 历史遗址　② 不能（about to 强调\"马上\"）　③ 为了纪念</p>\n</blockquote>\n<h3>✅ 接下来做什么</h3>\n<ul>\n<li><strong>3 道全对</strong> → 进入 E-1.3；词汇直接默写\"本单元必背 10 词\"。</li>\n<li><strong>对 2 道</strong> → 重读\"语法\"与\"写作\"，再做例题 2、3。</li>\n<li><strong>对 0–1 道</strong> → 从\"核心词汇\"顺序读到例题 3，再背词表。</li>\n</ul>\n<blockquote>\n<p><strong>过关线</strong>：期中做到例题 2｜期末做到例题 3 和变式。</p>\n</blockquote>\n<h3>🧠 本单元必背 10 词</h3>\n<p>destination, historic, former, view, memory, contribute, opportunity, transport, disappoint, adventure</p>"}, {"id": "E-1.3", "name": "Choices", "book": "必修第一册", "guess": "\"The vending machine who sells snacks is popular.\" 这句话错在哪里？", "html": "<p><strong>⚡ 先猜</strong>：\"The vending machine who sells snacks is popular.\" 这句话错在哪里？</p>\n<h3>30 秒概述</h3>\n<p>本单元讨论\"选择\"：读一篇关于食物与消费的文章（The good, the bad and the really ugly），学<strong>关系代词 who / whom / which / that / whose</strong> 引导的定语从句，写<strong>邀请、便条等简短信息</strong>。词汇集中在包装、回收、消费与判断。</p>\n<h3>30 秒自评</h3>\n<ol>\n<li>which 可以用来指人吗？</li>\n<li>whose 在定语从句中表示\"所属关系\"吗？</li>\n<li>关系代词在从句中作宾语时可以省略吗？</li>\n</ol>\n<blockquote>\n<p><strong>答案</strong>：1. 不能（指人用 who/whom，that 可指人也可指物）　2. 是　3. 可以（作宾语且非正式时）</p>\n</blockquote>\n<h3>🔑 核心词汇（10）</h3>\n<ul>\n<li><strong>convenience</strong> n. 便利：for <strong>convenience</strong> 为了方便；a <strong>convenience</strong> store 便利店</li>\n<li><strong>label</strong> n./v. 标签；贴标签：read the <strong>label</strong> 看标签；<strong>label</strong> the box 给盒子贴标签</li>\n<li><strong>recycle</strong> v. 回收利用：<strong>recycle</strong> paper 回收纸；a <strong>recycling</strong> bin 回收箱</li>\n<li><strong>facility</strong> n. 设施：public <strong>facilities</strong> 公共设施；sports <strong>facilities</strong> 体育设施</li>\n<li><strong>amount</strong> n. 数量：a large <strong>amount</strong> of 大量的（接不可数名词）</li>\n<li><strong>impact</strong> n. 影响：have an <strong>impact</strong> on 对……有影响</li>\n<li><strong>determine</strong> v. 决定；确定：<strong>determine</strong> to do 决心做；be <strong>determined</strong> to do 下定决心做</li>\n<li><strong>source</strong> n. 来源：the <strong>source</strong> of energy 能源来源；a reliable <strong>source</strong> 可靠来源</li>\n<li><strong>consumer</strong> n. 消费者：<strong>consumer</strong> rights 消费者权益；a <strong>consumer</strong> society 消费社会</li>\n<li><strong>establish</strong> v. 建立；确立：<strong>establish</strong> a company 创办公司；<strong>establish</strong> a habit 养成习惯</li>\n</ul>\n<h3>🧩 短语与搭配（8）</h3>\n<table>\n<thead>\n<tr>\n<th>短语</th>\n<th>意思</th>\n<th>例句</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>a large amount of</td>\n<td>大量的</td>\n<td>The factory uses <strong>a large amount of</strong> water.</td>\n</tr>\n<tr>\n<td>have an impact on</td>\n<td>对……有影响</td>\n<td>Packaging <strong>has an impact on</strong> the environment.</td>\n</tr>\n<tr>\n<td>be determined to do</td>\n<td>下定决心做</td>\n<td>She <strong>was determined to</strong> change her diet.</td>\n</tr>\n<tr>\n<td>a source of</td>\n<td>……的来源</td>\n<td>Sunlight is <strong>a source of</strong> energy.</td>\n</tr>\n<tr>\n<td>tend to do</td>\n<td>往往做</td>\n<td>Teenagers <strong>tend to</strong> buy snacks after school.</td>\n</tr>\n<tr>\n<td>remind somebody of</td>\n<td>使某人想起</td>\n<td>The label <strong>reminded me of</strong> my grandmother's kitchen.</td>\n</tr>\n<tr>\n<td>apologize to somebody for</td>\n<td>因……向某人道歉</td>\n<td>He <strong>apologized to</strong> us <strong>for</strong> the mistake.</td>\n</tr>\n<tr>\n<td>despite / in spite of</td>\n<td>尽管</td>\n<td><strong>Despite</strong> the price, the product sold well.</td>\n</tr>\n</tbody>\n</table>\n<h3>📐 语法：关系代词引导的定语从句</h3>\n<table>\n<thead>\n<tr>\n<th>关系代词</th>\n<th>指代</th>\n<th>在从句中作</th>\n<th>例句</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>who</td>\n<td>人</td>\n<td>主语/宾语</td>\n<td>the girl <strong>who</strong> won the prize</td>\n</tr>\n<tr>\n<td>whom</td>\n<td>人</td>\n<td>宾语（正式）</td>\n<td>the man <strong>whom</strong> we met</td>\n</tr>\n<tr>\n<td>which</td>\n<td>物</td>\n<td>主语/宾语</td>\n<td>the box <strong>which</strong> is made of plastic</td>\n</tr>\n<tr>\n<td>that</td>\n<td>人/物</td>\n<td>主语/宾语</td>\n<td>the book <strong>that</strong> I bought</td>\n</tr>\n<tr>\n<td>whose</td>\n<td>人/物</td>\n<td>定语（所属）</td>\n<td>the student <strong>whose</strong> idea won</td>\n</tr>\n</tbody>\n</table>\n<ol>\n<li>关系代词作宾语时可以省略：the book (that) I bought</li>\n<li>介词提前时只能用 whom / which：the person <strong>to whom</strong> I spoke</li>\n<li>\n<p><strong>非限制性</strong>定语从句用逗号隔开，不能用 that：My teacher, <strong>who</strong> is from Canada, ...</p>\n</li>\n<li>\n<p>指人用 which：the man which helped me（×）</p>\n</li>\n<li>从句缺主语却省略关系代词：the book I bought it（×，it 多余）</li>\n<li>\n<p>whose 后直接跟名词：whose <strong>idea</strong>（√），whose <strong>is</strong> idea（×）</p>\n</li>\n<li>\n<p>This is the shop <strong><em>_</em></strong>_ sells recycled bags. → <strong>which / that</strong></p>\n</li>\n<li>The girl <strong><em>_</em></strong>_ hair is curly is my sister. → <strong>whose</strong></li>\n<li>改错：The man who he called me is my uncle. → 去掉 he</li>\n</ol>\n<h3>✍️ 写作：简短信息（invitation / note）</h3>\n<p><strong>便条结构</strong>：称呼 → 事由（1 句）→ 时间地点（1 句）→ 期待/提醒（1 句）→ 署名</p>\n<ol>\n<li><strong>I'm writing to invite you to...</strong> 我写信是想邀请你……</li>\n<li><strong>It will be held at... on...</strong> 活动将于……在……举行。</li>\n<li><strong>Would you like to join us?</strong> 你愿意加入我们吗？</li>\n<li><strong>Please let me know if you can make it.</strong> 请告诉我你能否来。</li>\n<li><strong>Looking forward to seeing you there.</strong> 期待在那里见到你。</li>\n</ol>\n<h3>📖 阅读技能：根据上下文猜词义</h3>\n<p>遇到生词先看<strong>定义</strong>（that is, or）、<strong>举例</strong>（such as, like）、<strong>对比</strong>（but, however）和<strong>因果</strong>（because, so）。例：The packaging is <em>biodegradable</em>, <strong>that is</strong>, it can break down naturally. 由 that is 后的解释可知词义。</p>\n<h3>例题 1 · L1 词汇</h3>\n<p>用方框中的词填空：convenience / label / recycle / facility / impact</p>\n<ol>\n<li>The ______ on the bottle tells you what is inside.</li>\n<li>We should ______ plastic and paper instead of throwing them away.</li>\n<li>The new sports ______ is open to all students.</li>\n<li>For ______, the shop stays open until midnight.</li>\n<li>Fast food has a big ______ on our health.</li>\n</ol>\n<p><strong>解析</strong>：1. label　2. recycle　3. facility　4. convenience　5. impact</p>\n<p><strong>💥 陷阱</strong>：第 3 题 facility 常用复数 facilities，注意主谓一致（is open 单数，此处指一个场馆）。</p>\n<p><strong>变式</strong>：用 a large amount of 造句，表达\"这家工厂用了大量塑料\"。→ The factory uses a large amount of plastic.</p>\n<h3>例题 2 · L2 语法</h3>\n<p>合并句子（用关系代词）：\n1. I know a girl. Her father is a doctor.\n2. This is the bag. I bought it yesterday.\n3. The man is our teacher. We met him at the gate.</p>\n<p><strong>解析</strong>：\n1. I know a girl <strong>whose</strong> father is a doctor.\n2. This is the bag <strong>(which/that)</strong> I bought yesterday.\n3. The man <strong>(whom/who/that)</strong> we met at the gate is our teacher.</p>\n<p><strong>💥 陷阱</strong>：第 3 题保留 him，从句出现两个宾语；第 1 题用 who 代替 whose。</p>\n<p><strong>变式</strong>：把第 2 句改为非限制性定语从句。→ This bag, which I bought yesterday, is made of recycled plastic.</p>\n<h3>例题 3 · L3 翻译</h3>\n<p>翻译下列句子：\n1. 这家便利店使用可回收包装，这对环境有积极影响。\n2. 那个建议我们少买塑料瓶的女孩是我的同桌。\n3. 尽管价格更高，消费者仍然愿意购买有环保标签的产品。</p>\n<p><strong>参考译文</strong>：\n1. The <strong>convenience</strong> store uses <strong>recyclable</strong> packaging, <strong>which has a positive impact on</strong> the environment.\n2. The girl <strong>who advised us to buy fewer plastic bottles</strong> is my deskmate.\n3. <strong>Despite</strong> the higher price, <strong>consumers</strong> are still willing to buy products <strong>with</strong> an eco-friendly <strong>label</strong>.</p>\n<p><strong>采分点</strong>：① which 引导非限制性定语从句；② who 引导定语从句 + advise sb to do；③ despite + be willing to do。</p>\n<p><strong>💥 陷阱</strong>：第 1 句用 what 引导从句（×）；第 3 句 despite 后接句子（×，应接名词）。</p>\n<p><strong>变式</strong>：把第 1 句改为两个简单句。→ The convenience store uses recyclable packaging. This has a positive impact on the environment.</p>\n<h3>⏱️ 限时挑战（60 秒）</h3>\n<p>① whose 在从句中作什么成分？② 非限制性定语从句能否用 that？③ \"a large amount of\" 后接可数还是不可数名词？</p>\n<blockquote>\n<p>答案：① 定语　② 不能　③ 不可数</p>\n</blockquote>\n<h3>✅ 接下来做什么</h3>\n<ul>\n<li><strong>3 道全对</strong> → 进入 E-1.4；词汇直接默写\"本单元必背 10 词\"。</li>\n<li><strong>对 2 道</strong> → 重读\"语法\"与\"写作\"，再做例题 2、3。</li>\n<li><strong>对 0–1 道</strong> → 从\"核心词汇\"顺序读到例题 3，再背词表。</li>\n</ul>\n<blockquote>\n<p><strong>过关线</strong>：期中做到例题 2｜期末做到例题 3 和变式。</p>\n</blockquote>\n<h3>🧠 本单元必背 10 词</h3>\n<p>convenience, label, recycle, facility, amount, impact, determine, source, consumer, establish</p>"}, {"id": "E-1.4", "name": "My space", "book": "必修第一册", "guess": "\"This is the house where I lived in last year.\" 这句话对吗？", "html": "<p><strong>⚡ 先猜</strong>：\"This is the house where I lived in last year.\" 这句话对吗？</p>\n<h3>30 秒概述</h3>\n<p>本单元以\"我的空间\"为主题，读一篇关于 1940 年代老房子的文章（The 1940s house），学<strong>关系副词 when / where / why</strong> 引导的定语从句，写一篇<strong>描述房间</strong>的文章。词汇集中在住房、家用设备与生活安排。</p>\n<h3>30 秒自评</h3>\n<ol>\n<li>where 在定语从句中相当于\"介词 + which\"吗？</li>\n<li>why 引导定语从句时，先行词通常是 reason 吗？</li>\n<li>\"the day when we met\" 中的 when 可以换成 that 吗？</li>\n</ol>\n<blockquote>\n<p><strong>答案</strong>：1. 是（where = in/at/on which）　2. 是　3. 可以（the day that we met，that 作关系副词较少见但可接受；更常见省略）</p>\n</blockquote>\n<h3>🔑 核心词汇（10）</h3>\n<ul>\n<li><strong>experiment</strong> n./v. 实验：do an <strong>experiment</strong> 做实验；<strong>experiment</strong> with 尝试</li>\n<li><strong>capable</strong> adj. 有能力的：be <strong>capable</strong> of doing 有能力做</li>\n<li><strong>survive</strong> v. 幸存；挺过：<strong>survive</strong> the winter 熬过冬天；<strong>survival</strong> n. 生存</li>\n<li><strong>device</strong> n. 装置：a labour-saving <strong>device</strong> 省力装置；electronic <strong>devices</strong> 电子设备</li>\n<li><strong>regularly</strong> adv. 定期地：check <strong>regularly</strong> 定期检查；exercise <strong>regularly</strong> 经常锻炼</li>\n<li><strong>aim</strong> n./v. 目标；旨在：<strong>aim</strong> to do 旨在做；achieve one's <strong>aim</strong> 达到目标</li>\n<li><strong>suffer</strong> v. 遭受：<strong>suffer</strong> from 遭受（疾病、困难）；<strong>suffering</strong> n. 痛苦</li>\n<li><strong>decrease</strong> v./n. 减少：<strong>decrease</strong> by 减少了；<strong>decrease</strong> to 减少到</li>\n<li><strong>recommend</strong> v. 推荐：<strong>recommend</strong> doing 建议做；<strong>recommend</strong> somebody to do 建议某人做</li>\n<li><strong>responsibility</strong> n. 责任：take <strong>responsibility</strong> for 对……负责；a sense of <strong>responsibility</strong> 责任感</li>\n</ul>\n<h3>🧩 短语与搭配（8）</h3>\n<table>\n<thead>\n<tr>\n<th>短语</th>\n<th>意思</th>\n<th>例句</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>be capable of</td>\n<td>有能力做</td>\n<td>The device <strong>is capable of</strong> saving water.</td>\n</tr>\n<tr>\n<td>survive on</td>\n<td>靠……生存</td>\n<td>Some plants <strong>survive on</strong> very little water.</td>\n</tr>\n<tr>\n<td>aim to do</td>\n<td>旨在做</td>\n<td>The project <strong>aims to</strong> cut energy use.</td>\n</tr>\n<tr>\n<td>suffer from</td>\n<td>遭受</td>\n<td>Many old houses <strong>suffer from</strong> damp.</td>\n</tr>\n<tr>\n<td>decrease by / to</td>\n<td>减少了／到</td>\n<td>Sales <strong>decreased by</strong> 10% last year.</td>\n</tr>\n<tr>\n<td>recommend doing</td>\n<td>建议做</td>\n<td>I <strong>recommend</strong> checking the roof <strong>regularly</strong>.</td>\n</tr>\n<tr>\n<td>take responsibility for</td>\n<td>对……负责</td>\n<td>She <strong>takes responsibility for</strong> the repairs.</td>\n</tr>\n<tr>\n<td>prefer A to B</td>\n<td>更喜欢 A</td>\n<td>I <strong>prefer</strong> the small room <strong>to</strong> the big one.</td>\n</tr>\n</tbody>\n</table>\n<h3>📐 语法：关系副词引导的定语从句</h3>\n<table>\n<thead>\n<tr>\n<th>关系副词</th>\n<th>先行词</th>\n<th>相当于</th>\n<th>例句</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>when</td>\n<td>时间</td>\n<td>in/on/at which</td>\n<td>the year <strong>when</strong> we moved here</td>\n</tr>\n<tr>\n<td>where</td>\n<td>地点</td>\n<td>in/on/at which</td>\n<td>the room <strong>where</strong> I study</td>\n</tr>\n<tr>\n<td>why</td>\n<td>原因（reason）</td>\n<td>for which</td>\n<td>the reason <strong>why</strong> he left</td>\n</tr>\n</tbody>\n</table>\n<ol>\n<li>关系副词在从句中作<strong>状语</strong>，从句不缺主语或宾语</li>\n<li>where 的先行词可以是抽象地点：a point <strong>where</strong> we disagree</li>\n<li>\n<p>the reason why 后从句结构完整；若从句缺主语/宾语，用 that/which</p>\n</li>\n<li>\n<p>where 后重复介词：the house where I lived <strong>in</strong>（×）</p>\n</li>\n<li>先行词是地点却用 which 且从句缺状语：the room which I study（×，应为 where/in which）</li>\n<li>\n<p>when 与 that 混用导致从句缺状语：the day that we met <strong>on</strong>（×，去掉 on 或改用 when）</p>\n</li>\n<li>\n<p>This is the village <strong><em>_</em></strong>_ my grandparents live. → <strong>where</strong></p>\n</li>\n<li>I still remember the day <strong><em>_</em></strong>_ we first met. → <strong>when</strong></li>\n<li>改错：The reason why he was late because he missed the bus. → <strong>that</strong> he missed the bus（去掉 because）</li>\n</ol>\n<h3>✍️ 写作：描述一个房间</h3>\n<p><strong>结构</strong>：整体印象（1 句）→ 空间顺序（从门到窗、从左到右）→ 细节（颜色、材质、光线）→ 感受（1 句）</p>\n<ol>\n<li><strong>The first thing you notice is...</strong> 你首先注意到的是……</li>\n<li><strong>On the left, there is...; opposite it stands...</strong> 左边是……；对面立着……</li>\n<li><strong>The room is small but...</strong> 房间不大，但……</li>\n<li><strong>Light comes in through...</strong> 光从……照进来。</li>\n<li><strong>It is a room where I can...</strong> 这是一个我可以……的房间。</li>\n</ol>\n<h3>📖 阅读技能：识别指代（reference）</h3>\n<p>读到 it / they / this / these / such 时，回到<strong>前一句</strong>找它指代的名词。注意单复数与逻辑：如果代词是 they，前面一定是复数名词。做细节题时，先确定代词指代，再判断选项。</p>\n<h3>例题 1 · L1 词汇</h3>\n<p>用方框中的词填空：experiment / capable / device / regularly / responsibility</p>\n<ol>\n<li>The new ______ can save half of the electricity.</li>\n<li>She is ______ of fixing the old piano.</li>\n<li>We do an ______ every Friday afternoon.</li>\n<li>He checks the data ______.</li>\n<li>Taking care of the room is my ______.</li>\n</ol>\n<p><strong>解析</strong>：1. device　2. capable　3. experiment　4. regularly　5. responsibility</p>\n<p><strong>💥 陷阱</strong>：第 2 题 capable 后必须接 of doing，不能直接接动词原形。</p>\n<p><strong>变式</strong>：用 aim to do 造句，表达\"这个项目旨在减少能源消耗\"。→ The project aims to reduce energy consumption.</p>\n<h3>例题 2 · L2 语法</h3>\n<p>用适当的关系副词填空：\n1. This is the flat <strong><em>_</em>_ we lived for ten years.\n2. I'll never forget the morning </strong><strong><em>_ the letter arrived.\n3. Nobody knows the reason </em></strong>___ she left so suddenly.</p>\n<p><strong>💥 陷阱</strong>：第 1 题从句 live 后不需要介词（live 不及物，where = in which），不要写成 where... in。</p>\n<p><strong>变式</strong>：把第 1 句改为\"介词 + which\"结构。→ This is the flat in which we lived for ten years.</p>\n<h3>例题 3 · L3 翻译</h3>\n<p>翻译下列句子：\n1. 这是我小时候住过的房间，窗边放着一架旧钢琴。\n2. 他建议我们定期检查电器，以免发生事故。\n3. 尽管房子很小，它却是一个能让我放松的地方。</p>\n<p><strong>参考译文</strong>：\n1. This is the room <strong>where</strong> I lived as a child, <strong>with</strong> an old piano <strong>by the window</strong>.\n2. He <strong>recommends</strong> checking the <strong>devices regularly</strong> to <strong>prevent</strong> accidents.\n3. <strong>Although</strong> the house is small, it is a place <strong>where</strong> I can relax.</p>\n<p><strong>采分点</strong>：① where 引导定语从句 + with 复合结构；② recommend doing + regularly；③ although 让步 + where 定语从句。</p>\n<p><strong>💥 陷阱</strong>：第 1 句 where 后加 in；第 2 句 recommend 后接 to do（应为 doing 或 recommend sb to do）。</p>\n<p><strong>变式</strong>：把第 3 句改为\"so...that\"结构。→ The house is so small that it is easy to keep clean. / It is such a relaxing place that I often stay there.</p>\n<h3>⏱️ 限时挑战（60 秒）</h3>\n<p>① where 相当于什么？② the reason 后的定语从句用什么关系词？③ \"decrease by 10%\" 和 \"decrease to 10%\" 有何区别？</p>\n<blockquote>\n<p>答案：① 介词 + which　② why（或 that，视从句成分）　③ by 表幅度，to 表结果</p>\n</blockquote>\n<h3>✅ 接下来做什么</h3>\n<ul>\n<li><strong>3 道全对</strong> → 进入必修二；词汇直接默写\"本单元必背 10 词\"。</li>\n<li><strong>对 2 道</strong> → 重读\"语法\"与\"写作\"，再做例题 2、3。</li>\n<li><strong>对 0–1 道</strong> → 从\"核心词汇\"顺序读到例题 3，再背词表。</li>\n</ul>\n<blockquote>\n<p><strong>过关线</strong>：期中做到例题 2｜期末做到例题 3 和变式。</p>\n</blockquote>\n<h3>🧠 本单元必背 10 词</h3>\n<p>experiment, capable, survive, device, regularly, aim, suffer, decrease, recommend, responsibility</p>"}, {"id": "E-2.1", "name": "No limits", "book": "必修第二册", "guess": "\"While reading, the book was interesting.\" 这句话对吗？", "html": "<p><strong>⚡ 先猜</strong>：\"While reading, the book was interesting.\" 这句话对吗？</p>\n<h3>30 秒概述</h3>\n<p>本单元讨论\"极限\"：读一篇解释冒险心理的文章（Blame your brain），学<strong>省略（ellipsis）</strong>，写一篇<strong>描述你敬佩的人</strong>的文章。词汇集中在风险、判断、自信与成就。</p>\n<h3>30 秒自评</h3>\n<ol>\n<li>状语从句省略时，从句主语与主句主语必须一致吗？</li>\n<li>\"When (he was) young, he climbed the mountain.\" 是省略用法吗？</li>\n<li>不定式省略时，保留 to 吗？</li>\n</ol>\n<blockquote>\n<p><strong>答案</strong>：1. 是（否则不能省）　2. 是（省略 he was）　3. 通常保留（I want to.）</p>\n</blockquote>\n<h3>🔑 核心词汇（10）</h3>\n<ul>\n<li><strong>blame</strong> v./n. 责备；归咎：<strong>blame</strong> somebody for 因……责怪；be to <strong>blame</strong> 应受责备</li>\n<li><strong>factor</strong> n. 因素：a key <strong>factor</strong> 关键因素；<strong>factor</strong> in 把……考虑在内</li>\n<li><strong>pressure</strong> n. 压力：under <strong>pressure</strong> 在压力下；<strong>pressurize</strong> v. 施压</li>\n<li><strong>impress</strong> v. 使印象深刻：be <strong>impressed</strong> by 对……印象深刻；<strong>impressive</strong> adj. 令人印象深刻的</li>\n<li><strong>independent</strong> adj. 独立的：be <strong>independent</strong> of 不依赖；<strong>independence</strong> n. 独立</li>\n<li><strong>adapt</strong> v. 适应；改编：<strong>adapt</strong> to 适应；<strong>adapt</strong> a novel 改编小说</li>\n<li><strong>reveal</strong> v. 揭示：<strong>reveal</strong> the truth 揭示真相；<strong>revealing</strong> adj. 发人深省的</li>\n<li><strong>responsible</strong> adj. 负责的：be <strong>responsible</strong> for 对……负责；<strong>responsibility</strong> n. 责任</li>\n<li><strong>strategy</strong> n. 策略：a <strong>strategy</strong> for doing 做……的策略；<strong>strategic</strong> adj. 战略的</li>\n<li><strong>confidence</strong> n. 自信：have <strong>confidence</strong> in 对……有信心；<strong>confident</strong> adj. 自信的</li>\n</ul>\n<h3>🧩 短语与搭配（8）</h3>\n<table>\n<thead>\n<tr>\n<th>短语</th>\n<th>意思</th>\n<th>例句</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>be to blame</td>\n<td>应受责备</td>\n<td>The driver <strong>was to blame</strong> for the accident.</td>\n</tr>\n<tr>\n<td>under pressure</td>\n<td>在压力下</td>\n<td>He made the decision <strong>under pressure</strong>.</td>\n</tr>\n<tr>\n<td>be impressed by</td>\n<td>对……印象深刻</td>\n<td>We <strong>were impressed by</strong> her courage.</td>\n</tr>\n<tr>\n<td>adapt to</td>\n<td>适应</td>\n<td>It takes time to <strong>adapt to</strong> a new school.</td>\n</tr>\n<tr>\n<td>be responsible for</td>\n<td>对……负责</td>\n<td>Who <strong>is responsible for</strong> the plan?</td>\n</tr>\n<tr>\n<td>take a risk</td>\n<td>冒险</td>\n<td>Adventurers <strong>take risks</strong> every day.</td>\n</tr>\n<tr>\n<td>rely on</td>\n<td>依赖</td>\n<td>Don't <strong>rely on</strong> luck alone.</td>\n</tr>\n<tr>\n<td>in the face of</td>\n<td>面对</td>\n<td>She stayed calm <strong>in the face of</strong> danger.</td>\n</tr>\n</tbody>\n</table>\n<h3>📐 语法：省略（ellipsis）</h3>\n<table>\n<thead>\n<tr>\n<th>类型</th>\n<th>完整</th>\n<th>省略后</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>简单句</td>\n<td>(I) Beg your pardon.</td>\n<td>Beg your pardon.</td>\n</tr>\n<tr>\n<td>并列句</td>\n<td>I like tea and (I like) coffee.</td>\n<td>I like tea and coffee.</td>\n</tr>\n<tr>\n<td>状语从句</td>\n<td>When (he was) young, he skied.</td>\n<td>When young, he skied.</td>\n</tr>\n<tr>\n<td>定语从句</td>\n<td>the book (that) I bought</td>\n<td>the book I bought</td>\n</tr>\n<tr>\n<td>不定式</td>\n<td>I want to go, but I can't (go).</td>\n<td>I want to go, but I can't.</td>\n</tr>\n</tbody>\n</table>\n<ol>\n<li>状语从句省略：主语与主句一致，且从句谓语含 be 动词时，可省\"主语 + be\"</li>\n<li>不定式省略：保留 to（I'd like to.），be 动词/助动词常保留</li>\n<li>\n<p>省略不能造成歧义</p>\n</li>\n<li>\n<p>主语不一致仍省略：While reading, the book was interesting.（×，reading 的逻辑主语不是 book）</p>\n</li>\n<li>不定式省略漏 to：I didn't want to, but I had to.（√，had to 后省 go）</li>\n<li>\n<p>状语从句省略后连词后直接跟过去分词，逻辑主语错误：When seen from the hill, the city looks beautiful.（√，city 是 seen 的逻辑主语）</p>\n</li>\n<li>\n<p>While <strong><em>_</em></strong>_ (wait) for the bus, I met an old friend. → <strong>waiting</strong></p>\n</li>\n<li>He didn't come, though <strong><em>_</em></strong>_ (invite). → <strong>invited</strong></li>\n<li>改错：Although tired, but he kept working. → 去掉 but</li>\n</ol>\n<h3>✍️ 写作：描述你敬佩的人</h3>\n<p><strong>结构</strong>：点明人物与关系 → 2 个具体事例（体现品质）→ 影响与评价</p>\n<ol>\n<li><strong>The person I admire most is...</strong> 我最敬佩的人是……</li>\n<li><strong>What impresses me most is his/her...</strong> 最让我印象深刻的是他/她的……</li>\n<li><strong>Once, he/she...</strong> 有一次，他/她……</li>\n<li><strong>Thanks to him/her, I learned that...</strong> 多亏了他/她，我懂得了……</li>\n<li><strong>He/She is a person who...</strong> 他/她是一个……的人。</li>\n</ol>\n<h3>📖 阅读技能：找段落主旨</h3>\n<p>段首句常是主旨；若段首是例子，主旨多在段尾。先划出每段首尾句，再用 5 个字概括每段，串起来就是全文结构。</p>\n<h3>例题 1 · L1 词汇</h3>\n<p>用方框中的词填空：blame / pressure / adapt / reveal / confidence</p>\n<ol>\n<li>Don't ______ others for your own mistakes.</li>\n<li>She has great ______ in her own ability.</li>\n<li>It took him a month to ______ to the new job.</li>\n<li>The survey <strong><em>_</em>_ that most teenagers feel </strong>____ from exams.</li>\n</ol>\n<p><strong>解析</strong>：1. blame　2. confidence　3. adapt　4. revealed；pressure</p>\n<p><strong>💥 陷阱</strong>：第 4 题第二个空易填 pressuring，应为名词 pressure。</p>\n<p><strong>变式</strong>：用 be responsible for 造句，表达\"大脑负责我们的风险评估\"。→ The brain is responsible for our risk assessment.</p>\n<h3>例题 2 · L2 语法</h3>\n<p>改写为省略句：\n1. When he was young, he began to ski.\n2. If it is possible, we will start tomorrow.\n3. She didn't come, although she was invited.</p>\n<p><strong>解析</strong>：\n1. <strong>When young</strong>, he began to ski.\n2. <strong>If possible</strong>, we will start tomorrow.\n3. She didn't come, <strong>although invited</strong>.</p>\n<p><strong>💥 陷阱</strong>：第 3 题省略后仍保留 she was，写成 although she invited（被动变主动）。</p>\n<p><strong>变式</strong>：把 \"While I was walking in the park, I saw a fox.\" 改为省略句。→ While walking in the park, I saw a fox.</p>\n<h3>例题 3 · L3 翻译</h3>\n<p>翻译下列句子：\n1. 面对压力时，他总能保持自信并迅速适应。\n2. 调查显示，冒险并不总是鲁莽，关键在于判断。\n3. 我最敬佩的人是那位从不把失败归咎于别人的老师。</p>\n<p><strong>参考译文</strong>：\n1. <strong>In the face of pressure</strong>, he can always stay <strong>confident</strong> and <strong>adapt</strong> quickly.\n2. The survey <strong>reveals</strong> that <strong>taking risks</strong> is not always reckless; the key lies in <strong>judgement</strong>.\n3. The person I admire most is the teacher <strong>who never blames others for his failure</strong>.</p>\n<p><strong>采分点</strong>：① in the face of + stay confident；② reveal that + 动名词作主语；③ who 定语从句 + blame sb for。</p>\n<p><strong>💥 陷阱</strong>：第 1 句 adapt 后漏 to；第 3 句 blame 后介词用成 on。</p>\n<p><strong>变式</strong>：把第 2 句改为 \"It is...that...\" 强调句。→ It is judgement that matters most in taking risks.</p>\n<h3>⏱️ 限时挑战（60 秒）</h3>\n<p>① 状语从句省略的两个条件？② \"be to blame\" 的主动还是被动含义？③ confidence 的形容词形式？</p>\n<blockquote>\n<p>答案：① 主语一致、谓语含 be　② 主动（用主动表被动）　③ confident</p>\n</blockquote>\n<h3>✅ 接下来做什么</h3>\n<ul>\n<li><strong>3 道全对</strong> → 进入 E-2.2；词汇直接默写\"本单元必背 10 词\"。</li>\n<li><strong>对 2 道</strong> → 重读\"语法\"与\"写作\"，再做例题 2、3。</li>\n<li><strong>对 0–1 道</strong> → 从\"核心词汇\"顺序读到例题 3，再背词表。</li>\n</ul>\n<blockquote>\n<p><strong>过关线</strong>：期中做到例题 2｜期末做到例题 3 和变式。</p>\n</blockquote>\n<h3>🧠 本单元必背 10 词</h3>\n<p>blame, factor, pressure, impress, independent, adapt, reveal, responsible, strategy, confidence</p>"}, {"id": "E-2.2", "name": "Roads to education", "book": "必修第二册", "guess": "\"I am boring in this class.\" 和 \"This class is boring.\" 哪句有问题？", "html": "<p><strong>⚡ 先猜</strong>：\"I am boring in this class.\" 和 \"This class is boring.\" 哪句有问题？</p>\n<h3>30 秒概述</h3>\n<p>本单元讨论\"教育\"：读一篇关于教育实验的文章（An experiment in education），学 <strong>-ing 与 -ed 形式作定语</strong>，写一篇<strong>正反观点文章（for and against essay）</strong>。词汇集中在课堂、讲座、动机与学习效果。</p>\n<h3>30 秒自评</h3>\n<ol>\n<li>a bored student 和 a boring student 意思一样吗？</li>\n<li>-ed 形容词通常修饰\"人\"，-ing 形容词通常修饰\"物\"吗？</li>\n<li>\"a developing country\" 和 \"a developed country\" 意思相同吗？</li>\n</ol>\n<blockquote>\n<p><strong>答案</strong>：1. 不一样（感到无聊的学生 / 令人无聊的学生）　2. 大体如此（也有例外，如 a frightened look）　3. 不同（发展中国家 / 发达国家）</p>\n</blockquote>\n<h3>🔑 核心词汇（10）</h3>\n<ul>\n<li><strong>episode</strong> n. 一集；一段经历：the latest <strong>episode</strong> 最新一集；a painful <strong>episode</strong> 痛苦的经历</li>\n<li><strong>previous</strong> adj. 以前的：the <strong>previous</strong> year 前一年；<strong>previously</strong> adv. 先前</li>\n<li><strong>positive</strong> adj. 积极的；肯定的：a <strong>positive</strong> attitude 积极态度；<strong>positive</strong> effect 正面影响</li>\n<li><strong>effect</strong> n. 影响；效果：have an <strong>effect</strong> on 对……有影响；side <strong>effect</strong> 副作用</li>\n<li><strong>motivate</strong> v. 激励：<strong>motivate</strong> students to do 激励学生做；<strong>motivation</strong> n. 动机</li>\n<li><strong>audience</strong> n. 观众；听众：a large <strong>audience</strong> 大量观众；target <strong>audience</strong> 目标受众</li>\n<li><strong>benefit</strong> n./v. 益处；受益：<strong>benefit</strong> from 从……受益；be of <strong>benefit</strong> to 对……有益</li>\n<li><strong>cooperation</strong> n. 合作：in <strong>cooperation</strong> with 与……合作；<strong>cooperate</strong> v. 合作</li>\n<li><strong>academic</strong> adj. 学业的；学术的：<strong>academic</strong> performance 学业表现；<strong>academic</strong> year 学年</li>\n<li><strong>prevent</strong> v. 阻止：<strong>prevent</strong> somebody from doing 阻止某人做；<strong>prevention</strong> n. 预防</li>\n</ul>\n<h3>🧩 短语与搭配（8）</h3>\n<table>\n<thead>\n<tr>\n<th>短语</th>\n<th>意思</th>\n<th>例句</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>have an effect on</td>\n<td>对……有影响</td>\n<td>Music <strong>has a positive effect on</strong> mood.</td>\n</tr>\n<tr>\n<td>motivate somebody to do</td>\n<td>激励某人做</td>\n<td>Good teachers <strong>motivate</strong> us <strong>to</strong> learn.</td>\n</tr>\n<tr>\n<td>benefit from</td>\n<td>从……受益</td>\n<td>Students <strong>benefit from</strong> small classes.</td>\n</tr>\n<tr>\n<td>in cooperation with</td>\n<td>与……合作</td>\n<td>The school works <strong>in cooperation with</strong> a university.</td>\n</tr>\n<tr>\n<td>prevent somebody from doing</td>\n<td>阻止某人做</td>\n<td>Nothing can <strong>prevent</strong> him <strong>from</strong> trying.</td>\n</tr>\n<tr>\n<td>be based on</td>\n<td>以……为基础</td>\n<td>The course <strong>is based on</strong> real projects.</td>\n</tr>\n<tr>\n<td>take part in</td>\n<td>参加</td>\n<td>Everyone <strong>took part in</strong> the experiment.</td>\n</tr>\n<tr>\n<td>in terms of</td>\n<td>在……方面</td>\n<td><strong>In terms of</strong> results, the class improved.</td>\n</tr>\n</tbody>\n</table>\n<h3>📐 语法：-ing 与 -ed 形式作定语</h3>\n<table>\n<thead>\n<tr>\n<th>形式</th>\n<th>含义</th>\n<th>例子</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>-ing（主动/进行）</td>\n<td>令人……的；正在……的</td>\n<td>a <strong>boring</strong> lecture 无聊的讲座；a <strong>developing</strong> country 发展中国家</td>\n</tr>\n<tr>\n<td>-ed（被动/完成）</td>\n<td>感到……的；已经……的</td>\n<td>a <strong>bored</strong> student 感到无聊的学生；a <strong>developed</strong> country 发达国家</td>\n</tr>\n</tbody>\n</table>\n<ol>\n<li>修饰人常用 -ed（感到），修饰物常用 -ing（令人），但 <strong>a frightened look</strong>（人脸上\"感到害怕的\"表情）也常见</li>\n<li>不及物动词的 -ing 表进行：the <strong>rising</strong> sun；-ed 表完成：the <strong>risen</strong> sun（较少用）</li>\n<li>\n<p>短语作定语要后置：the students <strong>sitting in the front row</strong></p>\n</li>\n<li>\n<p>I am boring.（×，应为 bored；除非\"我这个人很无趣\"）</p>\n</li>\n<li>a developing country 与 a developed country 混用</li>\n<li>\n<p>-ing 短语作定语位置错误：the students sitting there（√，后置）；the sitting there students（×）</p>\n</li>\n<li>\n<p>The lecture was so <strong><em>_</em></strong>_ (bore) that half the audience fell asleep. → <strong>boring</strong></p>\n</li>\n<li><strong><em>_</em></strong>_ (interest) in the topic, she read three books about it. → <strong>Interested</strong></li>\n<li>改错：China is a developed country. → <strong>developing</strong></li>\n</ol>\n<h3>✍️ 写作：正反观点文章（for and against）</h3>\n<p><strong>结构</strong>：引入话题（1 句）→ 支持方 2 个理由 → 反对方 2 个理由 → 自己观点（1–2 句）</p>\n<ol>\n<li><strong>Opinions are divided on whether...</strong> 关于是否……意见不一。</li>\n<li><strong>Those who support it argue that...</strong> 支持者认为……</li>\n<li><strong>On the other hand, critics point out that...</strong> 另一方面，批评者指出……</li>\n<li><strong>In my view, the benefits outweigh the drawbacks.</strong> 在我看来，利大于弊。</li>\n<li><strong>A balance should be struck between...</strong> 应在……之间取得平衡。</li>\n</ol>\n<h3>📖 阅读技能：识别作者态度</h3>\n<p>注意形容词、副词与转折词：<strong>fortunately, unfortunately, surprisingly, however, yet</strong>。作者说 \"The results were, surprisingly, positive.\" 态度是\"意外但肯定\"。选项中常设\"中立/支持/反对\"三类。</p>\n<h3>例题 1 · L1 词汇</h3>\n<p>用方框中的词填空：episode / positive / motivate / benefit / prevent</p>\n<ol>\n<li>The new ______ of the series is about a school experiment.</li>\n<li>Praise can ______ students to work harder.</li>\n<li>Regular exercise has a ______ effect on health.</li>\n<li>We should ______ accidents by following the rules.</li>\n<li>Both sides ______ from the cooperation.</li>\n</ol>\n<p><strong>解析</strong>：1. episode　2. motivate　3. positive　4. prevent　5. benefit</p>\n<p><strong>💥 陷阱</strong>：第 5 题 benefit 作动词，主语 Both sides 后直接跟 from，不加 s。</p>\n<p><strong>变式</strong>：用 have an effect on 造句，表达\"教师的态度影响学生的动机\"。→ Teachers' attitudes have an effect on students' motivation.</p>\n<h3>例题 2 · L2 语法</h3>\n<p>用括号中词的正确形式填空：\n1. The <strong><em>_</em></strong><em> (excite) students waited for the result.\n2. It was an <strong><em>_</em></strong></em> (excite) match.\n3. The <strong><em>_</em></strong><em> (confuse) instructions made everyone lost.\n4. She looked <strong><em>_</em></strong></em> (confuse).</p>\n<p><strong>解析</strong>：1. excited　2. exciting　3. confusing　4. confused</p>\n<p><strong>💥 陷阱</strong>：第 3、4 题一个修饰物、一个修饰人，形式相反。</p>\n<p><strong>变式</strong>：用 \"a developing country\" 造句，表达\"发展中国家需要更多教育资源\"。→ A developing country needs more educational resources.</p>\n<h3>例题 3 · L3 翻译</h3>\n<p>翻译下列句子：\n1. 这项教育实验表明，小组合作对学生的学业表现有积极影响。\n2. 被这个讲座激励的学生决定成立一个读书俱乐部。\n3. 尽管有人认为考试会阻碍学习，我仍然认为它有助于发现问题和预防更大的失败。</p>\n<p><strong>参考译文</strong>：\n1. The education <strong>experiment</strong> shows that <strong>cooperation</strong> in groups <strong>has a positive effect on</strong> students' <strong>academic</strong> performance.\n2. The students <strong>motivated by</strong> the <strong>lecture</strong> decided to set up a reading club.\n3. Although some believe exams <strong>prevent</strong> learning, I still think they help <strong>discover</strong> problems and <strong>prevent</strong> bigger <strong>failures</strong>.</p>\n<p><strong>采分点</strong>：① show that + have an effect on；② 过去分词短语作定语；③ although 让步 + prevent...from 的省略形式。</p>\n<p><strong>💥 陷阱</strong>：第 2 句用 motivating（主动）修饰 students（应为被动\"被激励的\"）；第 3 句 prevent 后漏 from 或误加 from 后不接动名词。</p>\n<p><strong>变式</strong>：把第 1 句改为被动语态。→ It is shown by the experiment that cooperation in groups has a positive effect on students' academic performance.</p>\n<h3>⏱️ 限时挑战（60 秒）</h3>\n<p>① \"a bored student\" 与 \"a boring student\" 的区别？② \"developing country\" 的中文？③ benefit 作名词时的搭配？</p>\n<blockquote>\n<p>答案：① 感到无聊的学生 / 令人觉得无聊的学生　② 发展中国家　③ be of benefit to</p>\n</blockquote>\n<h3>✅ 接下来做什么</h3>\n<ul>\n<li><strong>3 道全对</strong> → 进入 E-2.3；词汇直接默写\"本单元必背 10 词\"。</li>\n<li><strong>对 2 道</strong> → 重读\"语法\"与\"写作\"，再做例题 2、3。</li>\n<li><strong>对 0–1 道</strong> → 从\"核心词汇\"顺序读到例题 3，再背词表。</li>\n</ul>\n<blockquote>\n<p><strong>过关线</strong>：期中做到例题 2｜期末做到例题 3 和变式。</p>\n</blockquote>\n<h3>🧠 本单元必背 10 词</h3>\n<p>episode, previous, positive, effect, motivate, audience, benefit, cooperation, academic, prevent</p>"}, {"id": "E-2.3", "name": "Progress?", "book": "必修第二册", "guess": "\"Walking down the street, the shops attracted me.\" 这句话有什么问题？", "html": "<p><strong>⚡ 先猜</strong>：\"Walking down the street, the shops attracted me.\" 这句话有什么问题？</p>\n<h3>30 秒概述</h3>\n<p>本单元讨论\"进步\"：读一篇关于全球化的文章（Going global），学 <strong>-ing 形式作状语</strong>，写一封<strong>咨询课程的正式邮件</strong>。词汇集中在气候、数据、农业与选择。</p>\n<h3>30 秒自评</h3>\n<ol>\n<li>-ing 形式作状语时，它的逻辑主语必须与主句主语一致吗？</li>\n<li>\"Having finished his homework, he went out.\" 表示动作先后吗？</li>\n<li>结果状语可以用 -ing 形式吗？</li>\n</ol>\n<blockquote>\n<p><strong>答案</strong>：1. 必须一致　2. 是（完成作业在先）　3. 可以（He fell, breaking his leg.）</p>\n</blockquote>\n<h3>🔑 核心词汇（10）</h3>\n<ul>\n<li><strong>climate</strong> n. 气候：<strong>climate</strong> change 气候变化；a mild <strong>climate</strong> 温和的气候</li>\n<li><strong>alarming</strong> adj. 令人担忧的：an <strong>alarming</strong> rate 惊人的速度；<strong>alarm</strong> v./n. 警报</li>\n<li><strong>rate</strong> n. 比率；速度：at a <strong>rate</strong> of 以……的速度；birth <strong>rate</strong> 出生率</li>\n<li><strong>predict</strong> v. 预测：<strong>predict</strong> the future 预测未来；<strong>prediction</strong> n. 预测</li>\n<li><strong>agriculture</strong> n. 农业：modern <strong>agriculture</strong> 现代农业；<strong>agricultural</strong> adj. 农业的</li>\n<li><strong>extinction</strong> n. 灭绝：face <strong>extinction</strong> 面临灭绝；<strong>extinct</strong> adj. 灭绝的</li>\n<li><strong>reduce</strong> v. 减少：<strong>reduce</strong> by 减少（幅度）；<strong>reduce</strong> to 减少到</li>\n<li><strong>option</strong> n. 选择：have no <strong>option</strong> but to do 别无选择只能；a better <strong>option</strong> 更好的选择</li>\n<li><strong>graduate</strong> v./n. 毕业；毕业生：<strong>graduate</strong> from 毕业于；a college <strong>graduate</strong> 大学毕业生</li>\n<li><strong>fund</strong> n./v. 基金；资助：raise <strong>funds</strong> 筹款；<strong>fund</strong> a project 资助项目</li>\n</ul>\n<h3>🧩 短语与搭配（8）</h3>\n<table>\n<thead>\n<tr>\n<th>短语</th>\n<th>意思</th>\n<th>例句</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>at an alarming rate</td>\n<td>以惊人的速度</td>\n<td>Forests are disappearing <strong>at an alarming rate</strong>.</td>\n</tr>\n<tr>\n<td>predict the future</td>\n<td>预测未来</td>\n<td>No one can <strong>predict the future</strong> exactly.</td>\n</tr>\n<tr>\n<td>face extinction</td>\n<td>面临灭绝</td>\n<td>Many species <strong>face extinction</strong>.</td>\n</tr>\n<tr>\n<td>reduce... by/to</td>\n<td>减少……／到……</td>\n<td>We must <strong>reduce</strong> waste <strong>by</strong> half.</td>\n</tr>\n<tr>\n<td>have no option but to do</td>\n<td>别无选择只能</td>\n<td>They <strong>had no option but to</strong> leave.</td>\n</tr>\n<tr>\n<td>graduate from</td>\n<td>毕业于</td>\n<td>She <strong>graduated from</strong> a college in Shanghai.</td>\n</tr>\n<tr>\n<td>raise funds for</td>\n<td>为……筹款</td>\n<td>Students <strong>raised funds for</strong> the project.</td>\n</tr>\n<tr>\n<td>rely on</td>\n<td>依赖</td>\n<td>Farming <strong>relies on</strong> the weather.</td>\n</tr>\n</tbody>\n</table>\n<h3>📐 语法：-ing 形式作状语</h3>\n<table>\n<thead>\n<tr>\n<th>类型</th>\n<th>例句</th>\n<th>相当于</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>时间</td>\n<td><strong>Walking</strong> home, I met an old friend.</td>\n<td>When I was walking home</td>\n</tr>\n<tr>\n<td>原因</td>\n<td><strong>Being</strong> ill, he didn't come.</td>\n<td>Because he was ill</td>\n</tr>\n<tr>\n<td>条件</td>\n<td><strong>Working</strong> hard, you will succeed.</td>\n<td>If you work hard</td>\n</tr>\n<tr>\n<td>结果</td>\n<td>He fell, <strong>breaking</strong> his leg.</td>\n<td>and broke his leg</td>\n</tr>\n<tr>\n<td>伴随</td>\n<td>She sat by the window, <strong>reading</strong>.</td>\n<td>and read</td>\n</tr>\n</tbody>\n</table>\n<ol>\n<li>逻辑主语必须与主句主语一致</li>\n<li>完成式 having done 表示动作发生在主句动作之前</li>\n<li>\n<p>否定式 not doing / not having done</p>\n</li>\n<li>\n<p>逻辑主语不一致：<strong>Walking</strong> down the street, the shops attracted me.（×，应为 I was attracted...）</p>\n</li>\n<li>完成式与一般式混用：<strong>Finishing</strong> his work, he went home.（应为 Having finished，强调先后）</li>\n<li>\n<p>否定形式错误：<strong>Not</strong> having money, he...（√）；Having not money（×）</p>\n</li>\n<li>\n<p><strong><em>_</em></strong>_ (see) from the hill, the city looks beautiful. → <strong>Seen</strong>（注意：此处用过去分词，因 city 被看）</p>\n</li>\n<li><strong><em>_</em></strong>_ (not know) the answer, she kept silent. → <strong>Not knowing</strong></li>\n<li>改错：Having finished the report, the meeting began. → <strong>Having finished the report, he left for the meeting.</strong>（逻辑主语一致）</li>\n</ol>\n<h3>✍️ 写作：正式咨询邮件（formal email of enquiry）</h3>\n<p><strong>结构</strong>：称呼（Dear Sir/Madam）→ 说明来意 → 具体问题（2–3 个）→ 期待回复 → 署名</p>\n<ol>\n<li><strong>I am writing to enquire about...</strong> 我写信是想咨询……</li>\n<li><strong>I would be grateful if you could tell me...</strong> 如能告知……我将不胜感激。</li>\n<li><strong>Could you please let me know whether...?</strong> 能否告知是否……？</li>\n<li><strong>I would also like to know...</strong> 我还想知道……</li>\n<li><strong>I look forward to hearing from you.</strong> 期待您的回复。</li>\n</ol>\n<h3>📖 阅读技能：读数字与趋势</h3>\n<p>看到数字先判断它说明\"数量、比例还是速度\"；注意 by / to / from / to 的区别（increase <strong>by</strong> 10% 增长了 10%；increase <strong>to</strong> 10% 增长到 10%）。图表题先看单位与时间轴。</p>\n<h3>例题 1 · L1 词汇</h3>\n<p>用方框中的词填空：climate / rate / predict / reduce / option</p>\n<ol>\n<li>Scientists cannot ______ earthquakes exactly.</li>\n<li>The birth ______ has fallen in recent years.</li>\n<li>We have no ______ but to wait.</li>\n<li>We should ______ the use of plastic.</li>\n<li>______ change is a global problem.</li>\n</ol>\n<p><strong>解析</strong>：1. predict　2. rate　3. option　4. reduce　5. Climate</p>\n<p><strong>💥 陷阱</strong>：第 3 题 have no option but to do 中 but 后接带 to 的不定式。</p>\n<p><strong>变式</strong>：用 at an alarming rate 造句，表达\"城市以惊人的速度扩张\"。→ Cities are expanding at an alarming rate.</p>\n<h3>例题 2 · L2 语法</h3>\n<p>用 -ing 形式改写句子：\n1. Because he was tired, he went to bed early.\n2. After she finished the work, she went shopping.\n3. If you turn left, you will see the museum.</p>\n<p><strong>解析</strong>：\n1. <strong>Being tired</strong>, he went to bed early.\n2. <strong>Having finished the work</strong>, she went shopping.\n3. <strong>Turning left</strong>, you will see the museum.</p>\n<p><strong>💥 陷阱</strong>：第 2 题用 Finishing（一般式），未体现\"完成在先\"。</p>\n<p><strong>变式</strong>：用 -ing 形式合并：\"He sat by the window. He read a book.\" → He sat by the window, reading a book.</p>\n<h3>例题 3 · L3 翻译</h3>\n<p>翻译下列句子：\n1. 森林正以惊人的速度消失，许多物种因此面临灭绝。\n2. 为了减少污染，政府别无选择，只能资助公共交通。\n3. 看到这些数据，我们意识到必须立即采取行动。</p>\n<p><strong>参考译文</strong>：\n1. Forests are disappearing <strong>at an alarming rate</strong>, and many species <strong>face extinction</strong> as a result.\n2. To <strong>reduce</strong> pollution, the government <strong>had no option but to</strong> <strong>fund</strong> public transport.\n3. <strong>Seeing</strong> these figures, we realized that we must take action <strong>immediately</strong>.</p>\n<p><strong>采分点</strong>：① at an alarming rate + face extinction；② have no option but to do；③ -ing 作状语 + realize that。</p>\n<p><strong>💥 陷阱</strong>：第 3 句 Seeing 的逻辑主语与主句不一致（应为 we）；第 2 句 but 后漏 to。</p>\n<p><strong>变式</strong>：把第 1 句改为定语从句：Forests, which are disappearing at an alarming rate, are home to many species facing extinction.</p>\n<h3>⏱️ 限时挑战（60 秒）</h3>\n<p>① -ing 作状语的两个前提？② \"reduce by 10%\" 与 \"reduce to 10%\" 的区别？③ \"have no option but to do\" 中 but 后接什么？</p>\n<blockquote>\n<p>答案：① 逻辑主语一致、动作关系清楚　② 幅度／结果　③ 带 to 的不定式</p>\n</blockquote>\n<h3>✅ 接下来做什么</h3>\n<ul>\n<li><strong>3 道全对</strong> → 进入 E-2.4；词汇直接默写\"本单元必背 10 词\"。</li>\n<li><strong>对 2 道</strong> → 重读\"语法\"与\"写作\"，再做例题 2、3。</li>\n<li><strong>对 0–1 道</strong> → 从\"核心词汇\"顺序读到例题 3，再背词表。</li>\n</ul>\n<blockquote>\n<p><strong>过关线</strong>：期中做到例题 2｜期末做到例题 3 和变式。</p>\n</blockquote>\n<h3>🧠 本单元必背 10 词</h3>\n<p>climate, alarming, rate, predict, agriculture, extinction, reduce, option, graduate, fund</p>"}, {"id": "E-2.4", "name": "Achievements", "book": "必修第二册", "guess": "\"He studied hard only to fail the exam.\" 里的 only to 表示什么？", "html": "<p><strong>⚡ 先猜</strong>：\"He studied hard only to fail the exam.\" 里的 only to 表示什么？</p>\n<h3>30 秒概述</h3>\n<p>本单元以\"成就\"为主题，读《老人与海》节选（An excerpt from The Old Man and the Sea），学<strong>动词不定式作状语</strong>，写一篇<strong>关于体育课的观点文章</strong>。词汇集中在奋斗、目标、失败与坚持。</p>\n<h3>30 秒自评</h3>\n<ol>\n<li>不定式可以表示目的、结果和原因吗？</li>\n<li>\"only to do\" 通常表示\"出乎意料的结果\"吗？</li>\n<li>\"too...to...\" 结构中 to 表示否定含义吗？</li>\n</ol>\n<blockquote>\n<p><strong>答案</strong>：1. 可以　2. 是（常含\"结果却……\"的意味）　3. 是（太……以至于不能……）</p>\n</blockquote>\n<h3>🔑 核心词汇（10）</h3>\n<ul>\n<li><strong>gain</strong> v./n. 获得；增加：<strong>gain</strong> experience 获得经验；<strong>gain</strong> weight 增重</li>\n<li><strong>attract</strong> v. 吸引：<strong>attract</strong> attention 吸引注意；<strong>attractive</strong> adj. 有吸引力的</li>\n<li><strong>target</strong> n./v. 目标；以……为目标：hit the <strong>target</strong> 命中目标；be <strong>targeted</strong> at 针对</li>\n<li><strong>approach</strong> n./v. 方法；接近：a new <strong>approach</strong> to 新方法；<strong>approach</strong> the problem 处理问题</li>\n<li><strong>defeat</strong> v./n. 击败；失败：<strong>defeat</strong> the enemy 打败敌人；admit <strong>defeat</strong> 认输</li>\n<li><strong>strength</strong> n. 力量；长处：physical <strong>strength</strong> 体力；<strong>strengths</strong> and weaknesses 优缺点</li>\n<li><strong>struggle</strong> v./n. 奋斗；挣扎：<strong>struggle</strong> to do 努力做；<strong>struggle</strong> with 与……斗争</li>\n<li><strong>maintain</strong> v. 维持；保养：<strong>maintain</strong> balance 保持平衡；<strong>maintain</strong> that 坚持认为</li>\n<li><strong>outstanding</strong> adj. 杰出的：an <strong>outstanding</strong> achievement 杰出成就；<strong>outstanding</strong> performance 出色表现</li>\n<li><strong>realistic</strong> adj. 现实的：a <strong>realistic</strong> goal 现实的目标；be <strong>realistic</strong> about 对……现实</li>\n</ul>\n<h3>🧩 短语与搭配（8）</h3>\n<table>\n<thead>\n<tr>\n<th>短语</th>\n<th>意思</th>\n<th>例句</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>gain experience</td>\n<td>获得经验</td>\n<td>You <strong>gain experience</strong> by doing.</td>\n</tr>\n<tr>\n<td>attract attention</td>\n<td>吸引注意</td>\n<td>The poster <strong>attracted</strong> a lot of <strong>attention</strong>.</td>\n</tr>\n<tr>\n<td>a new approach to</td>\n<td>……的新方法</td>\n<td>We need <strong>a new approach to</strong> the problem.</td>\n</tr>\n<tr>\n<td>struggle to do</td>\n<td>努力做</td>\n<td>He <strong>struggled to</strong> stand up.</td>\n</tr>\n<tr>\n<td>maintain that</td>\n<td>坚持认为</td>\n<td>She <strong>maintains that</strong> hard work pays off.</td>\n</tr>\n<tr>\n<td>be proud of</td>\n<td>为……自豪</td>\n<td>We are <strong>proud of</strong> his achievement.</td>\n</tr>\n<tr>\n<td>give up</td>\n<td>放弃</td>\n<td>Never <strong>give up</strong> halfway.</td>\n</tr>\n<tr>\n<td>in the face of</td>\n<td>面对</td>\n<td>He stayed calm <strong>in the face of</strong> defeat.</td>\n</tr>\n</tbody>\n</table>\n<h3>📐 语法：动词不定式作状语</h3>\n<table>\n<thead>\n<tr>\n<th>类型</th>\n<th>例句</th>\n<th>说明</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>目的</td>\n<td>He got up early <strong>to catch</strong> the bus.</td>\n<td>= in order to / so as to</td>\n</tr>\n<tr>\n<td>结果</td>\n<td>He studied hard, <strong>only to fail</strong>.</td>\n<td>出乎意料的结果</td>\n</tr>\n<tr>\n<td>结果</td>\n<td>She is old enough <strong>to vote</strong>.</td>\n<td>enough to</td>\n</tr>\n<tr>\n<td>结果</td>\n<td>He is too tired <strong>to walk</strong>.</td>\n<td>too...to（含否定）</td>\n</tr>\n<tr>\n<td>原因</td>\n<td>I'm glad <strong>to see</strong> you.</td>\n<td>情绪形容词后</td>\n</tr>\n</tbody>\n</table>\n<ol>\n<li>目的状语：to do / in order to do / so as to do（so as to 不放句首）</li>\n<li>结果状语：only to do（意外结果）；enough to / too...to / so...as to</li>\n<li>\n<p>原因状语：be glad / sorry / surprised to do</p>\n</li>\n<li>\n<p>目的状语用 for doing：I came here for seeing you.（×，应用 to see）</p>\n</li>\n<li>only to 与 only doing 混用：He fell, only to break his leg.（结果用 to do）</li>\n<li>\n<p>too...to 后加 not：too tired not to walk（×，too...to 本身含否定）</p>\n</li>\n<li>\n<p>He hurried to the station, only <strong><em>_</em></strong>_ (find) the train had left. → <strong>to find</strong></p>\n</li>\n<li>She is old enough <strong><em>_</em></strong>_ (make) her own decision. → <strong>to make</strong></li>\n<li>改错：I'm sorry for hear the news. → <strong>I'm sorry to hear the news.</strong></li>\n</ol>\n<h3>✍️ 写作：观点文章（opinion essay）</h3>\n<p><strong>结构</strong>：亮明观点 → 2 个理由 + 例子 → 让步（承认对方一点）→ 重申观点</p>\n<ol>\n<li><strong>In my opinion, ... should...</strong> 我认为……应该……</li>\n<li><strong>The main reason is that...</strong> 主要原因是……</li>\n<li><strong>For example, ...</strong> 例如……</li>\n<li><strong>Admittedly, ..., but...</strong> 诚然……，但是……</li>\n<li><strong>Therefore, I strongly believe that...</strong> 因此，我坚信……</li>\n</ol>\n<h3>📖 阅读技能：读文学作品（symbol &amp; theme）</h3>\n<p>小说节选先抓三件事：<strong>人物想要什么</strong>、<strong>遇到什么阻碍</strong>、<strong>最后明白了什么</strong>。再看反复出现的意象（大海、鲨鱼、鱼线）——它们往往承载主题。不要逐词翻译，先读情节骨架。</p>\n<h3>例题 1 · L1 词汇</h3>\n<p>用方框中的词填空：gain / attract / approach / strength / maintain</p>\n<ol>\n<li>The exhibition ______ thousands of visitors last year.</li>\n<li>We need a new ______ to teaching grammar.</li>\n<li>He used all his ______ to lift the box.</li>\n<li>It is hard to ______ such a high speed.</li>\n<li>You will ______ a lot from this experience.</li>\n</ol>\n<p><strong>解析</strong>：1. attracted　2. approach　3. strength　4. maintain　5. gain</p>\n<p><strong>💥 陷阱</strong>：第 1 题 attract 的过去式双写 t（attracted 不双写；注意与 planned 类区分）。</p>\n<p><strong>变式</strong>：用 be proud of 造句，表达\"我们为他的坚持感到自豪\"。→ We are proud of his persistence.</p>\n<h3>例题 2 · L2 语法</h3>\n<p>用不定式完成句子：\n1. He got up early <strong><em>_</em></strong><em> (catch) the first train.\n2. She was too excited <strong><em>_</em></strong></em> (say) a word.\n3. I'm glad <strong><em>_</em></strong>_ (meet) you here.</p>\n<p><strong>解析</strong>：1. <strong>to catch</strong>（目的）　2. <strong>to say</strong>（too...to 含否定）　3. <strong>to meet</strong>（原因）</p>\n<p><strong>💥 陷阱</strong>：第 2 题误加 not，写成 not to say。</p>\n<p><strong>变式</strong>：用 only to 改写：\"He tried to open the door, but found it locked.\" → He tried to open the door, only to find it locked.</p>\n<h3>例题 3 · L3 翻译</h3>\n<p>翻译下列句子：\n1. 那位老人与鲨鱼搏斗了几个小时，最终只带回一副鱼骨。\n2. 为了保持平衡，他不得不用尽全身力气抓住鱼线。\n3. 虽然他没有赢得比赛，但他的坚持赢得了所有人的尊重。</p>\n<p><strong>参考译文</strong>：\n1. The old man <strong>struggled with</strong> the shark for hours, <strong>only to</strong> bring back a skeleton.\n2. <strong>To maintain</strong> his balance, he had to <strong>use all his strength to</strong> hold the line.\n3. Although he didn't win the match, his <strong>persistence</strong> won everyone's <strong>respect</strong>.</p>\n<p><strong>采分点</strong>：① struggle with + only to；② to maintain 目的状语；③ although 让步 + win respect。</p>\n<p><strong>💥 陷阱</strong>：第 1 句 only to 后接动词原形（brought 错）；第 3 句用 win 的过去式 won。</p>\n<p><strong>变式</strong>：把第 1 句改为定语从句：The old man, who struggled with the shark for hours, brought back only a skeleton.</p>\n<h3>⏱️ 限时挑战（60 秒）</h3>\n<p>① 不定式作状语的三种意义？② \"only to\" 表达什么？③ \"too...to\" 是否含否定？</p>\n<blockquote>\n<p>答案：① 目的、结果、原因　② 出乎意料的结果　③ 含否定</p>\n</blockquote>\n<h3>✅ 接下来做什么</h3>\n<ul>\n<li><strong>3 道全对</strong> → 进入必修三；词汇直接默写\"本单元必背 10 词\"。</li>\n<li><strong>对 2 道</strong> → 重读\"语法\"与\"写作\"，再做例题 2、3。</li>\n<li><strong>对 0–1 道</strong> → 从\"核心词汇\"顺序读到例题 3，再背词表。</li>\n</ul>\n<blockquote>\n<p><strong>过关线</strong>：期中做到例题 2｜期末做到例题 3 和变式。</p>\n</blockquote>\n<h3>🧠 本单元必背 10 词</h3>\n<p>gain, attract, target, approach, defeat, strength, struggle, maintain, outstanding, realistic</p>"}, {"id": "E-3.1", "name": "The media", "book": "必修第三册", "guess": "\"I saw the journalist interviewed the star.\" 这句话对吗？", "html": "<p><strong>⚡ 先猜</strong>：\"I saw the journalist interviewed the star.\" 这句话对吗？</p>\n<h3>30 秒概述</h3>\n<p>本单元讨论\"媒体\"：读一篇关于记者工作的文章（Journalists on the job），学 <strong>-ing 与 -ed 形式作宾语补足语</strong>，写一篇<strong>影评（film review）</strong>。词汇集中在新闻、报道、核实与娱乐。</p>\n<h3>30 秒自评</h3>\n<ol>\n<li>\"see somebody do\" 与 \"see somebody doing\" 有什么区别？</li>\n<li>\"have something done\" 表示\"让某事被做\"吗？</li>\n<li>感官动词后的宾语补足语可以用 -ed 形式吗？</li>\n</ol>\n<blockquote>\n<p><strong>答案</strong>：1. do 表示看到全过程，doing 表示看到正在进行　2. 是（也可表示\"遭遇\"）　3. 可以（I heard the song sung in English.）</p>\n</blockquote>\n<h3>🔑 核心词汇（10）</h3>\n<ul>\n<li><strong>journalist</strong> n. 记者：a <strong>journalist</strong> for 为……工作的记者；<strong>journalism</strong> n. 新闻业</li>\n<li><strong>authority</strong> n. 权威；当局：the <strong>authorities</strong> 当局；an <strong>authority</strong> on 在……方面的权威</li>\n<li><strong>annual</strong> adj. 每年的：an <strong>annual</strong> report 年度报告；<strong>annually</strong> adv. 每年</li>\n<li><strong>spot</strong> v./n. 发现；地点：<strong>spot</strong> a mistake 发现错误；a tourist <strong>spot</strong> 旅游景点</li>\n<li><strong>ensure</strong> v. 确保：<strong>ensure</strong> that 确保；<strong>ensure</strong> safety 确保安全</li>\n<li><strong>affect</strong> v. 影响：<strong>affect</strong> the result 影响结果；be <strong>affected</strong> by 受……影响</li>\n<li><strong>confirm</strong> v. 确认：<strong>confirm</strong> the news 证实消息；<strong>confirmation</strong> n. 确认</li>\n<li><strong>publish</strong> v. 出版；发表：<strong>publish</strong> a book 出版书；<strong>publication</strong> n. 出版物</li>\n<li><strong>plot</strong> n. 情节：the <strong>plot</strong> of a film 电影情节；a simple <strong>plot</strong> 简单的情节</li>\n<li><strong>entertaining</strong> adj. 有趣的：an <strong>entertaining</strong> film 娱乐性强的电影；<strong>entertainment</strong> n. 娱乐</li>\n</ul>\n<h3>🧩 短语与搭配（8）</h3>\n<table>\n<thead>\n<tr>\n<th>短语</th>\n<th>意思</th>\n<th>例句</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>be responsible for</td>\n<td>对……负责</td>\n<td>A journalist <strong>is responsible for</strong> the truth.</td>\n</tr>\n<tr>\n<td>check the facts</td>\n<td>核实事实</td>\n<td>Always <strong>check the facts</strong> before publishing.</td>\n</tr>\n<tr>\n<td>affect the audience</td>\n<td>影响观众</td>\n<td>The report <strong>affected</strong> a wide <strong>audience</strong>.</td>\n</tr>\n<tr>\n<td>confirm the news</td>\n<td>证实消息</td>\n<td>The office <strong>confirmed the news</strong> later.</td>\n</tr>\n<tr>\n<td>publish an article</td>\n<td>发表文章</td>\n<td>She <strong>published an article</strong> about the event.</td>\n</tr>\n<tr>\n<td>be based on</td>\n<td>基于</td>\n<td>The film <strong>is based on</strong> a true story.</td>\n</tr>\n<tr>\n<td>attract attention</td>\n<td>吸引注意</td>\n<td>The headline <strong>attracted</strong> much <strong>attention</strong>.</td>\n</tr>\n<tr>\n<td>in the public eye</td>\n<td>在公众视野中</td>\n<td>Celebrities live <strong>in the public eye</strong>.</td>\n</tr>\n</tbody>\n</table>\n<h3>📐 语法：-ing 与 -ed 形式作宾语补足语</h3>\n<table>\n<thead>\n<tr>\n<th>结构</th>\n<th>含义</th>\n<th>例句</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>see/hear/watch + sb + doing</td>\n<td>看到/听到某人正在做</td>\n<td>I saw him <strong>writing</strong> the report.</td>\n</tr>\n<tr>\n<td>see/hear/watch + sb + do</td>\n<td>看到/听到某人做（全过程）</td>\n<td>I saw him <strong>write</strong> the report.</td>\n</tr>\n<tr>\n<td>have/get + sth + done</td>\n<td>让某事被做；遭遇</td>\n<td>I had my camera <strong>repaired</strong>.</td>\n</tr>\n<tr>\n<td>keep/leave + sb/sth + doing</td>\n<td>使……持续</td>\n<td>The news kept people <strong>talking</strong>.</td>\n</tr>\n<tr>\n<td>find + sb/sth + done</td>\n<td>发现……被……</td>\n<td>She found the door <strong>locked</strong>.</td>\n</tr>\n</tbody>\n</table>\n<ol>\n<li>感官动词 + doing（进行）与 + do（全过程）意义不同</li>\n<li>have sth done 的主语不一定执行动作</li>\n<li>\n<p>-ed 作补语表示被动或完成</p>\n</li>\n<li>\n<p>感官动词后误加 to：I saw him to write.（×）</p>\n</li>\n<li>have sth done 与 have sb do 混用：I had him repair it.（√，让他修）/ I had it repaired.（√，让别人修）</li>\n<li>\n<p>-ed 与 -ing 补语混淆：I found the film boring.（√，电影令人无聊）/ I found the film bored.（×）</p>\n</li>\n<li>\n<p>I heard her <strong><em>_</em></strong>_ (sing) in the next room. → <strong>singing</strong></p>\n</li>\n<li>He had his hair <strong><em>_</em></strong>_ (cut) yesterday. → <strong>cut</strong></li>\n<li>改错：We watched the match played in the rain. → <strong>playing</strong>（比赛正在进行）</li>\n</ol>\n<h3>✍️ 写作：影评（film review）</h3>\n<p><strong>结构</strong>：片名与类型 → 一句话剧情（不剧透）→ 亮点（表演/音乐/画面）→ 不足（可选）→ 推荐指数</p>\n<ol>\n<li><strong>... is a film that...</strong> ……是一部……的电影。</li>\n<li><strong>The story is based on...</strong> 故事改编自……</li>\n<li><strong>What impressed me most was...</strong> 最打动我的是……</li>\n<li><strong>The film is worth watching because...</strong> 这部电影值得看，因为……</li>\n<li><strong>I would recommend it to anyone who...</strong> 我把它推荐给所有……的人。</li>\n</ol>\n<h3>📖 阅读技能：新闻标题与导语</h3>\n<p>新闻标题常省略冠词和 be 动词（<strong>Journalist wins award</strong>），导语（第一段）回答 who/what/when/where/why。读标题先猜主题，再读导语核对；细节题按关键词定位。</p>\n<h3>例题 1 · L1 词汇</h3>\n<p>用方框中的词填空：journalist / authority / confirm / publish / plot</p>\n<ol>\n<li>The ______ interviewed three witnesses.</li>\n<li>The police ______ the identity of the driver.</li>\n<li>The novel was ______ last year.</li>\n<li>The ______ of the film is easy to follow.</li>\n<li>She is an ______ on ancient Chinese poetry.</li>\n</ol>\n<p><strong>解析</strong>：1. journalist　2. confirmed　3. published　4. plot　5. authority</p>\n<p><strong>💥 陷阱</strong>：第 5 题 authority 表示\"权威人士\"，前用 an。</p>\n<p><strong>变式</strong>：用 be based on 造句，表达\"这部电影改编自真实事件\"。→ The film is based on a true story.</p>\n<h3>例题 2 · L2 语法</h3>\n<p>用括号中词的正确形式填空：\n1. I watched the children <strong><em>_</em></strong><em> (play) football.\n2. She had her computer <strong><em>_</em></strong></em> (fix) yesterday.\n3. We found the door <strong><em>_</em></strong><em> (lock).\n4. The teacher kept us <strong><em>_</em></strong></em> (read) for an hour.</p>\n<p><strong>解析</strong>：1. playing　2. fixed　3. locked　4. reading</p>\n<p><strong>💥 陷阱</strong>：第 3 题 find + 宾语 + done，表示\"发现门被锁着\"。</p>\n<p><strong>变式</strong>：用 \"have sth done\" 改写：\"Someone repaired my bike.\" → I had my bike repaired.</p>\n<h3>例题 3 · L3 翻译</h3>\n<p>翻译下列句子：\n1. 记者必须核实事实，确保报道不影响无辜的人。\n2. 我看到她正在编辑那篇关于电影情节的文章。\n3. 这部纪录片基于真实事件，虽然有些地方令人不安，但非常值得一看。</p>\n<p><strong>参考译文</strong>：\n1. A <strong>journalist</strong> must <strong>check the facts</strong> to <strong>ensure</strong> that the report does not <strong>affect</strong> innocent people.\n2. I saw her <strong>editing</strong> the article about the film's <strong>plot</strong>.\n3. The documentary <strong>is based on</strong> true events. Although some parts are <strong>disturbing</strong>, it is well <strong>worth watching</strong>.</p>\n<p><strong>采分点</strong>：① check the facts + ensure that；② see sb doing；③ be based on + although + be worth doing。</p>\n<p><strong>💥 陷阱</strong>：第 2 句用 see her edit（全过程）而非 editing（正在进行）；第 3 句 worth 后接 to watch（×）。</p>\n<p><strong>变式</strong>：把第 1 句改为被动语态：The facts must be checked by a journalist to ensure that...</p>\n<h3>⏱️ 限时挑战（60 秒）</h3>\n<p>① see sb do 与 see sb doing 的区别？② have sth done 的含义？③ \"be worth doing\" 中 doing 能否换成 to do？</p>\n<blockquote>\n<p>答案：① 全过程／正在进行　② 让某事被做或遭遇　③ 不能</p>\n</blockquote>\n<h3>✅ 接下来做什么</h3>\n<ul>\n<li><strong>3 道全对</strong> → 进入 E-3.2；词汇直接默写\"本单元必背 10 词\"。</li>\n<li><strong>对 2 道</strong> → 重读\"语法\"与\"写作\"，再做例题 2、3。</li>\n<li><strong>对 0–1 道</strong> → 从\"核心词汇\"顺序读到例题 3，再背词表。</li>\n</ul>\n<blockquote>\n<p><strong>过关线</strong>：期中做到例题 2｜期末做到例题 3 和变式。</p>\n</blockquote>\n<h3>🧠 本单元必背 10 词</h3>\n<p>journalist, authority, annual, spot, ensure, affect, confirm, publish, plot, entertaining</p>"}, {"id": "E-3.2", "name": "The things around us", "book": "必修第三册", "guess": "\"This kind of cloth is washed well.\" 和 \"This kind of cloth washes well.\" 哪句更自然？", "html": "<p><strong>⚡ 先猜</strong>：\"This kind of cloth is washed well.\" 和 \"This kind of cloth washes well.\" 哪句更自然？</p>\n<h3>30 秒概述</h3>\n<p>本单元从一件 T 恤出发，读它的\"全球旅程\"（The story of a T-shirt），学<strong>被动语态的各种形式</strong>，写一篇<strong>描述过程</strong>的文章。词汇集中在生产、贸易、收入与环境。</p>\n<h3>30 秒自评</h3>\n<ol>\n<li>被动语态可以用于现在完成时和情态动词吗？</li>\n<li>\"The shirt washes well.\" 是主动形式表被动意义吗？</li>\n<li>\"need doing\" 等于 \"need to be done\" 吗？</li>\n</ol>\n<blockquote>\n<p><strong>答案</strong>：1. 可以（has been done / can be done）　2. 是　3. 是</p>\n</blockquote>\n<h3>🔑 核心词汇（10）</h3>\n<ul>\n<li><strong>cotton</strong> n. 棉花：a <strong>cotton</strong> shirt 棉衬衫；<strong>cotton</strong> fields 棉田</li>\n<li><strong>export</strong> v./n. 出口：<strong>export</strong> to 出口到；<strong>exports</strong> 出口商品</li>\n<li><strong>profit</strong> n./v. 利润；获益：make a <strong>profit</strong> 获利；<strong>profitable</strong> adj. 有利可图的</li>\n<li><strong>involve</strong> v. 涉及；使参与：be <strong>involved</strong> in 参与；<strong>involve</strong> doing 需要做</li>\n<li><strong>income</strong> n. 收入：a steady <strong>income</strong> 稳定收入；<strong>income</strong> tax 所得税</li>\n<li><strong>quantity</strong> n. 数量：a large <strong>quantity</strong> of 大量的（可数/不可数）；in <strong>quantity</strong> 大量地</li>\n<li><strong>majority</strong> n. 大多数：the <strong>majority</strong> of 大多数；a <strong>majority</strong> vote 多数票</li>\n<li><strong>equipment</strong> n. 设备（不可数）：a piece of <strong>equipment</strong> 一件设备；modern <strong>equipment</strong> 现代设备</li>\n<li><strong>advanced</strong> adj. 先进的：<strong>advanced</strong> technology 先进技术；<strong>advance</strong> v./n. 前进</li>\n<li><strong>remarkable</strong> adj. 显著的：a <strong>remarkable</strong> change 显著变化；<strong>remarkably</strong> adv. 非常</li>\n</ul>\n<h3>🧩 短语与搭配（8）</h3>\n<table>\n<thead>\n<tr>\n<th>短语</th>\n<th>意思</th>\n<th>例句</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>be made of / from</td>\n<td>由……制成</td>\n<td>The shirt <strong>is made of</strong> cotton.</td>\n</tr>\n<tr>\n<td>be exported to</td>\n<td>出口到</td>\n<td>Most of the cotton <strong>is exported to</strong> Asia.</td>\n</tr>\n<tr>\n<td>be involved in</td>\n<td>参与；涉及</td>\n<td>Many workers <strong>are involved in</strong> the process.</td>\n</tr>\n<tr>\n<td>a large quantity of</td>\n<td>大量的</td>\n<td><strong>A large quantity of</strong> water <strong>is</strong> used.</td>\n</tr>\n<tr>\n<td>the majority of</td>\n<td>大多数</td>\n<td><strong>The majority of</strong> customers are young.</td>\n</tr>\n<tr>\n<td>be equipped with</td>\n<td>配备</td>\n<td>The factory <strong>is equipped with</strong> new machines.</td>\n</tr>\n<tr>\n<td>make a profit</td>\n<td>获利</td>\n<td>The company <strong>made a profit</strong> last year.</td>\n</tr>\n<tr>\n<td>be replaced by</td>\n<td>被……取代</td>\n<td>Workers may <strong>be replaced by</strong> robots.</td>\n</tr>\n</tbody>\n</table>\n<h3>📐 语法：被动语态的各种形式</h3>\n<table>\n<thead>\n<tr>\n<th>时态/形式</th>\n<th>结构</th>\n<th>例句</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>一般现在</td>\n<td>am/is/are done</td>\n<td>The shirt <strong>is made</strong> in China.</td>\n</tr>\n<tr>\n<td>一般过去</td>\n<td>was/were done</td>\n<td>It <strong>was sold</strong> last week.</td>\n</tr>\n<tr>\n<td>一般将来</td>\n<td>will be done</td>\n<td>It <strong>will be shipped</strong> tomorrow.</td>\n</tr>\n<tr>\n<td>现在完成</td>\n<td>has/have been done</td>\n<td>The order <strong>has been sent</strong>.</td>\n</tr>\n<tr>\n<td>情态动词</td>\n<td>can/must be done</td>\n<td>It <strong>can be recycled</strong>.</td>\n</tr>\n<tr>\n<td>现在进行</td>\n<td>is/are being done</td>\n<td>The road <strong>is being repaired</strong>.</td>\n</tr>\n</tbody>\n</table>\n<ol>\n<li>被动语态 = be + 过去分词；时态体现在 be 上</li>\n<li>主动形式表被动：sell / wash / write / read 等表属性（The pen <strong>writes</strong> smoothly.）</li>\n<li>need / want / require + doing = to be done（The shirt <strong>needs washing</strong>.）</li>\n<li>\n<p>不及物动词无被动（happen, appear, belong to）</p>\n</li>\n<li>\n<p>漏 be：The shirt made in China.（×）</p>\n</li>\n<li>用错时态：The order has sent.（×，应为 has been sent）</li>\n<li>\n<p>把 happen 用于被动：The accident was happened.（×）</p>\n</li>\n<li>\n<p>The new bridge <strong><em>_</em></strong>_ (build) next year. → <strong>will be built</strong></p>\n</li>\n<li>The letter <strong><em>_</em></strong>_ (send) already. → <str
