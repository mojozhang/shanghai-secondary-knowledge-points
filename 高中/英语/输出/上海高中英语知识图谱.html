ong>has been sent</strong></li>\n<li>改错：The book is worth to read. → <strong>The book is worth reading.</strong>（或 The book is worth being read. 不自然）</li>\n</ol>\n<h3>✍️ 写作：描述过程（process）</h3>\n<p><strong>结构</strong>：总起（要描述什么过程）→ 分步（first, next, then, after that, finally）→ 小结（结果/意义），多用被动语态</p>\n<ol>\n<li><strong>The process can be divided into... steps.</strong> 这个过程可分为……步。</li>\n<li><strong>First, ... is collected / picked.</strong> 首先，……被收集/采摘。</li>\n<li><strong>Next, it is sent to... where it is...</strong> 接着，它被送到……在那里被……</li>\n<li><strong>After that, ...</strong> 在那之后，……</li>\n<li><strong>Finally, the product is ready for...</strong> 最后，产品可以用于……</li>\n</ol>\n<h3>📖 阅读技能：读流程图与数据</h3>\n<p>流程题先找<strong>起点</strong>与<strong>终点</strong>，再看箭头之间的动词（多为被动）。数据题注意单位、年份与比较对象；\"twice as many as\" 这类倍数表达要还原成数字再判断。</p>\n<h3>例题 1 · L1 词汇</h3>\n<p>用方框中的词填空：cotton / export / profit / involve / equipment</p>\n<ol>\n<li>The T-shirt is made of ______.</li>\n<li>The company ______ its products to over 30 countries.</li>\n<li>The factory uses modern ______.</li>\n<li>Many workers are ______ in the process.</li>\n<li>They made a large ______ last year.</li>\n</ol>\n<p><strong>解析</strong>：1. cotton　2. exports　3. equipment　4. involved　5. profit</p>\n<p><strong>💥 陷阱</strong>：第 3 题 equipment 不可数，不能加 s。</p>\n<p><strong>变式</strong>：用 be made from 造句，表达\"纸是由木材制成的\"。→ Paper is made from wood.</p>\n<h3>例题 2 · L2 语法</h3>\n<p>把下列句子改为被动语态：\n1. They grow cotton in Xinjiang.\n2. Someone has sent the order.\n3. We must protect the environment.</p>\n<p><strong>解析</strong>：\n1. Cotton <strong>is grown</strong> in Xinjiang.\n2. The order <strong>has been sent</strong>.\n3. The environment <strong>must be protected</strong>.</p>\n<p><strong>💥 陷阱</strong>：第 2 题漏 been；第 3 题 must 后漏 be。</p>\n<p><strong>变式</strong>：把 \"The shirt needs washing.\" 改为同义句。→ The shirt needs to be washed.</p>\n<h3>例题 3 · L3 翻译</h3>\n<p>翻译下列句子：\n1. 这件 T 恤由棉花制成，在另一个国家被染色，然后出口到世界各地。\n2. 大多数工人参与了生产过程，但他们的收入并不高。\n3. 由于采用了先进设备，这家工厂的产量显著提高。</p>\n<p><strong>参考译文</strong>：\n1. The T-shirt <strong>is made of</strong> cotton, <strong>is dyed</strong> in another country, and then <strong>is exported</strong> all over the world.\n2. <strong>The majority of</strong> the workers <strong>are involved in</strong> the production process, but their <strong>income</strong> is not high.\n3. Because <strong>advanced equipment</strong> <strong>has been adopted</strong>, the factory's <strong>output</strong> has increased <strong>remarkably</strong>.</p>\n<p><strong>采分点</strong>：① 三个并列被动；② the majority of + be involved in；③ because 从句 + 现在完成被动。</p>\n<p><strong>💥 陷阱</strong>：第 1 句时态不一致（is made / was dyed）；第 3 句 output 拼写与 remarkable 副词形式。</p>\n<p><strong>变式</strong>：把第 3 句改为 \"with 复合结构\"：With advanced equipment adopted, the factory's output has increased remarkably.</p>\n<h3>⏱️ 限时挑战（60 秒）</h3>\n<p>① 现在完成时的被动结构？② 哪些动词主动表被动？③ \"need doing\" 等于什么？</p>\n<blockquote>\n<p>答案：① has/have been done　② sell, wash, write, read 等　③ need to be done</p>\n</blockquote>\n<h3>✅ 接下来做什么</h3>\n<ul>\n<li><strong>3 道全对</strong> → 进入 E-3.3；词汇直接默写\"本单元必背 10 词\"。</li>\n<li><strong>对 2 道</strong> → 重读\"语法\"与\"写作\"，再做例题 2、3。</li>\n<li><strong>对 0–1 道</strong> → 从\"核心词汇\"顺序读到例题 3，再背词表。</li>\n</ul>\n<blockquote>\n<p><strong>过关线</strong>：期中做到例题 2｜期末做到例题 3 和变式。</p>\n</blockquote>\n<h3>🧠 本单元必背 10 词</h3>\n<p>cotton, export, profit, involve, income, quantity, majority, equipment, advanced, remarkable</p>"}, {"id": "E-3.3", "name": "The way we are", "book": "必修第三册", "guess": "\"I have no time to watch TV.\" 中的 to watch TV 修饰什么？", "html": "<p><strong>⚡ 先猜</strong>：\"I have no time to watch TV.\" 中的 to watch TV 修饰什么？</p>\n<h3>30 秒概述</h3>\n<p>本单元讨论\"我们如何看待自己\"：读一篇关于\"理想美\"的文章（Ideal beauty），学<strong>动词不定式作定语</strong>，写一封<strong>给建议专栏的回复</strong>。词汇集中在外貌、代表性、性别与个人形象。</p>\n<h3>30 秒自评</h3>\n<ol>\n<li>不定式作定语通常放在被修饰名词之后吗？</li>\n<li>\"something to eat\" 中的 to eat 与 something 是动宾关系吗？</li>\n<li>\"the first to arrive\" 中的 to arrive 修饰 the first 吗？</li>\n</ol>\n<blockquote>\n<p><strong>答案</strong>：1. 是（后置）　2. 是　3. 是</p>\n</blockquote>\n<h3>🔑 核心词汇（10）</h3>\n<ul>\n<li><strong>ideal</strong> adj./n. 理想的；理想：an <strong>ideal</strong> body 理想身材；<strong>ideal</strong> conditions 理想条件</li>\n<li><strong>representation</strong> n. 代表；表现：a <strong>representation</strong> of beauty 美的呈现；<strong>represent</strong> v. 代表</li>\n<li><strong>generation</strong> n. 一代人：the younger <strong>generation</strong> 年轻一代；<strong>generational</strong> adj. 代际的</li>\n<li><strong>elegant</strong> adj. 优雅的：an <strong>elegant</strong> dress 优雅的裙子；<strong>elegance</strong> n. 优雅</li>\n<li><strong>display</strong> v./n. 展示：on <strong>display</strong> 展出；<strong>display</strong> confidence 表现出自信</li>\n<li><strong>vary</strong> v. 变化；不同：<strong>vary</strong> from...to... 从……到……不等；<strong>variety</strong> n. 多样性</li>\n<li><strong>context</strong> n. 背景；语境：in the <strong>context</strong> of 在……背景下；<strong>contextual</strong> adj. 上下文的</li>\n<li><strong>gender</strong> n. 性别：<strong>gender</strong> roles 性别角色；<strong>gender</strong> equality 性别平等</li>\n<li><strong>personality</strong> n. 个性：a strong <strong>personality</strong> 鲜明的个性；<strong>personal</strong> adj. 个人的</li>\n<li><strong>impression</strong> n. 印象：make an <strong>impression</strong> on 给……留下印象；<strong>impress</strong> v. 使印象深刻</li>\n</ul>\n<h3>🧩 短语与搭配（8）</h3>\n<table>\n<thead>\n<tr>\n<th>短语</th>\n<th>意思</th>\n<th>例句</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>be obsessed with</td>\n<td>痴迷于</td>\n<td>Many teenagers <strong>are obsessed with</strong> looks.</td>\n</tr>\n<tr>\n<td>make an impression on</td>\n<td>给……留下印象</td>\n<td>Her confidence <strong>made an impression on</strong> us.</td>\n</tr>\n<tr>\n<td>vary from...to...</td>\n<td>从……到……不等</td>\n<td>Beauty standards <strong>vary from</strong> culture <strong>to</strong> culture.</td>\n</tr>\n<tr>\n<td>in the context of</td>\n<td>在……背景下</td>\n<td><strong>In the context of</strong> social media, images matter.</td>\n</tr>\n<tr>\n<td>on display</td>\n<td>展出</td>\n<td>The photos are <strong>on display</strong> in the hall.</td>\n</tr>\n<tr>\n<td>be judged by</td>\n<td>根据……评判</td>\n<td>People should not <strong>be judged by</strong> their looks.</td>\n</tr>\n<tr>\n<td>a sense of identity</td>\n<td>认同感</td>\n<td>Clothes can give us <strong>a sense of identity</strong>.</td>\n</tr>\n<tr>\n<td>break the stereotype</td>\n<td>打破刻板印象</td>\n<td>The show tries to <strong>break the stereotype</strong>.</td>\n</tr>\n</tbody>\n</table>\n<h3>📐 语法：动词不定式作定语</h3>\n<table>\n<thead>\n<tr>\n<th>结构</th>\n<th>例子</th>\n<th>说明</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>名词 + to do</td>\n<td>the ability <strong>to adapt</strong></td>\n<td>表示将要/需要做的动作</td>\n</tr>\n<tr>\n<td>something/nothing + to do</td>\n<td>something <strong>to eat</strong></td>\n<td>动宾关系</td>\n</tr>\n<tr>\n<td>the first/last/only + to do</td>\n<td>the first <strong>to arrive</strong></td>\n<td>序数词后</td>\n</tr>\n<tr>\n<td>have + 名词 + to do</td>\n<td>have no time <strong>to waste</strong></td>\n<td>有时含被动含义</td>\n</tr>\n</tbody>\n</table>\n<ol>\n<li>不定式作定语放在名词后</li>\n<li>不及物动词作定语时需加介词：a chair <strong>to sit on</strong>；a pen <strong>to write with</strong></li>\n<li>\n<p>不定式与所修饰名词有动宾关系时，注意逻辑主语</p>\n</li>\n<li>\n<p>漏介词：a pen to write（×，应为 to write with）</p>\n</li>\n<li>位置错误：the to read book（×）</li>\n<li>\n<p>不定式与分词混用：the boiling water（正在烧开）/ the water to boil（要烧开的水）</p>\n</li>\n<li>\n<p>I need a chair <strong><em>_</em></strong>_ (sit). → <strong>to sit on</strong></p>\n</li>\n<li>She is always the first <strong><em>_</em></strong><em> (come) and the last <strong><em>_</em></strong></em> (leave). → <strong>to come；to leave</strong></li>\n<li>改错：There is nothing to worry. → <strong>There is nothing to worry about.</strong></li>\n</ol>\n<h3>✍️ 写作：建议专栏回复（advice column reply）</h3>\n<p><strong>结构</strong>：共情（1 句）→ 分析问题（2 句）→ 2–3 条具体建议 → 鼓励（1 句）</p>\n<ol>\n<li><strong>I'm sorry to hear that you...</strong> 听说你……我很难过。</li>\n<li><strong>It is normal to feel...</strong> 感到……是正常的。</li>\n<li><strong>Here are a few things you could try.</strong> 你可以试试这几件事。</li>\n<li><strong>Instead of comparing yourself with others, ...</strong> 与其和别人比较，不如……</li>\n<li><strong>Remember that...</strong> 记住……</li>\n</ol>\n<h3>📖 阅读技能：区分事实与观点</h3>\n<p>事实可验证（The survey covered 2,000 teenagers.），观点含评价（Beauty standards are too narrow.）。注意 <strong>should, ought to, beautiful, ugly, better</strong> 等词；题目问 \"What is the author's opinion?\" 时，找评价性表达。</p>\n<h3>例题 1 · L1 词汇</h3>\n<p>用方框中的词填空：ideal / generation / display / vary / personality</p>\n<ol>\n<li>Beauty standards ______ from culture to culture.</li>\n<li>The younger ______ cares more about self-expression.</li>\n<li>Her ______ makes her popular among classmates.</li>\n<li>The photos are on ______ in the school hall.</li>\n<li>No one has an ______ face.</li>\n</ol>\n<p><strong>解析</strong>：1. vary　2. generation　3. personality　4. display　5. ideal</p>\n<p><strong>💥 陷阱</strong>：第 1 题 vary 的主语是复数 standards，用原形。</p>\n<p><strong>变式</strong>：用 make an impression on 造句，表达\"她的演讲给观众留下深刻印象\"。→ Her speech made a deep impression on the audience.</p>\n<h3>例题 2 · L2 语法</h3>\n<p>用不定式完成句子：\n1. She has a strong desire <strong><em>_</em></strong><em> (succeed).\n2. There is nothing <strong><em>_</em></strong></em> (worry) about.\n3. He is the only person <strong><em>_</em></strong>_ (know) the truth.</p>\n<p><strong>💥 陷阱</strong>：第 2 题 worry 后保留 about（不定式作定语时介词不能丢）。</p>\n<p><strong>变式</strong>：用 \"a room to live in\" 造句：I finally found a room to live in.</p>\n<h3>例题 3 · L3 翻译</h3>\n<p>翻译下列句子：\n1. 不同文化对美的理解不同，年轻人尤其容易受影响。\n2. 与其追求理想的外表，不如培养能让你自信的能力。\n3. 给建议专栏写信的那个女孩说，她再也不想被外表评判了。</p>\n<p><strong>参考译文</strong>：\n1. Understandings of beauty <strong>vary from</strong> culture <strong>to</strong> culture, and young people are especially easy to <strong>be affected</strong>.\n2. <strong>Instead of</strong> chasing an <strong>ideal</strong> appearance, develop the ability <strong>to make</strong> you confident.\n3. The girl <strong>who wrote to the advice column</strong> said she <strong>no longer wanted to be judged by</strong> her looks.</p>\n<p><strong>采分点</strong>：① vary from...to...；② instead of + 动名词；③ who 定语从句 + be judged by。</p>\n<p><strong>💥 陷阱</strong>：第 2 句 instead of 后接 to do（×）；第 3 句 no longer 位置错误。</p>\n<p><strong>变式</strong>：把第 2 句改为 \"It is better to...\" 句型：It is better to develop the ability that makes you confident than to chase an ideal appearance.</p>\n<h3>⏱️ 限时挑战（60 秒）</h3>\n<p>① 不定式作定语的位置？② \"a pen to write with\" 为什么加 with？③ 事实与观点如何区分？</p>\n<blockquote>\n<p>答案：① 名词后　② write 不及物，需介词接宾语　③ 事实可验证，观点含评价</p>\n</blockquote>\n<h3>✅ 接下来做什么</h3>\n<ul>\n<li><strong>3 道全对</strong> → 进入 E-3.4；词汇直接默写\"本单元必背 10 词\"。</li>\n<li><strong>对 2 道</strong> → 重读\"语法\"与\"写作\"，再做例题 2、3。</li>\n<li><strong>对 0–1 道</strong> → 从\"核心词汇\"顺序读到例题 3，再背词表。</li>\n</ul>\n<blockquote>\n<p><strong>过关线</strong>：期中做到例题 2｜期末做到例题 3 和变式。</p>\n</blockquote>\n<h3>🧠 本单元必背 10 词</h3>\n<p>ideal, representation, generation, elegant, display, vary, context, gender, personality, impression</p>"}, {"id": "E-3.4", "name": "Travellers' tales", "book": "必修第三册", "guess": "\"Seen from the top, the valley looks like a map.\" 中 Seen 的逻辑主语是谁？", "html": "<p><strong>⚡ 先猜</strong>：\"Seen from the top, the valley looks like a map.\" 中 Seen 的逻辑主语是谁？</p>\n<h3>30 秒概述</h3>\n<p>本单元讲\"旅行者的故事\"：读一篇关于\"少有人走的路\"的文章（A road less travelled），学 <strong>-ed 形式作状语</strong>，写一篇<strong>旅行故事</strong>。词汇集中在旅行、自然保护与个人感受。</p>\n<h3>30 秒自评</h3>\n<ol>\n<li>-ed 作状语时，主句主语是它的逻辑宾语吗？</li>\n<li>\"Tired, he sat down.\" 中 Tired 表示原因吗？</li>\n<li>-ed 与 -ing 作状语的区别是什么？</li>\n</ol>\n<blockquote>\n<p><strong>答案</strong>：1. 是（被动/完成关系）　2. 是　3. -ing 表主动/进行，-ed 表被动/完成</p>\n</blockquote>\n<h3>🔑 核心词汇（10）</h3>\n<ul>\n<li><strong>guideline</strong> n. 指导原则：follow the <strong>guidelines</strong> 遵循指南；safety <strong>guidelines</strong> 安全准则</li>\n<li><strong>track</strong> n./v. 小路；追踪：a mountain <strong>track</strong> 山间小路；<strong>track</strong> the animals 追踪动物</li>\n<li><strong>enthusiasm</strong> n. 热情：with <strong>enthusiasm</strong> 热情地；<strong>enthusiastic</strong> adj. 热情的</li>\n<li><strong>conservation</strong> n. 保护：wildlife <strong>conservation</strong> 野生动物保护；<strong>conserve</strong> v. 保护</li>\n<li><strong>escape</strong> v./n. 逃离：<strong>escape</strong> from 从……逃离；a narrow <strong>escape</strong> 死里逃生</li>\n<li><strong>highlight</strong> n./v. 亮点；突出：the <strong>highlight</strong> of the trip 旅行亮点；<strong>highlight</strong> the problem 突出问题</li>\n<li><strong>concept</strong> n. 概念：the <strong>concept</strong> of  ……的概念；a new <strong>concept</strong> 新概念</li>\n<li><strong>specific</strong> adj. 具体的：a <strong>specific</strong> example 具体例子；be <strong>specific</strong> about 对……具体说明</li>\n<li><strong>harm</strong> n./v. 伤害：do <strong>harm</strong> to 对……有害；<strong>harmful</strong> adj. 有害的</li>\n<li><strong>engage</strong> v. 参与；吸引：<strong>engage</strong> in 参与；<strong>engage</strong> the audience 吸引观众</li>\n</ul>\n<h3>🧩 短语与搭配（8）</h3>\n<table>\n<thead>\n<tr>\n<th>短语</th>\n<th>意思</th>\n<th>例句</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>set off</td>\n<td>出发</td>\n<td>We <strong>set off</strong> before sunrise.</td>\n</tr>\n<tr>\n<td>be engaged in</td>\n<td>从事；参与</td>\n<td>She <strong>is engaged in</strong> a conservation project.</td>\n</tr>\n<tr>\n<td>do harm to</td>\n<td>对……有害</td>\n<td>Tourism can <strong>do harm to</strong> the environment.</td>\n</tr>\n<tr>\n<td>in search of</td>\n<td>寻找</td>\n<td>They travelled <strong>in search of</strong> a quieter beach.</td>\n</tr>\n<tr>\n<td>escape from</td>\n<td>从……逃离</td>\n<td>The deer <strong>escaped from</strong> the fire.</td>\n</tr>\n<tr>\n<td>be specific about</td>\n<td>对……具体</td>\n<td>Be <strong>specific about</strong> what you want to see.</td>\n</tr>\n<tr>\n<td>highlight the importance of</td>\n<td>强调……的重要性</td>\n<td>The guide <strong>highlighted the importance of</strong> conservation.</td>\n</tr>\n<tr>\n<td>look back on</td>\n<td>回顾</td>\n<td>I often <strong>look back on</strong> that journey.</td>\n</tr>\n</tbody>\n</table>\n<h3>📐 语法：-ed 形式作状语</h3>\n<table>\n<thead>\n<tr>\n<th>类型</th>\n<th>例句</th>\n<th>相当于</th>\n</tr>\n</thead>\n<tbody>\n<tr>\n<td>原因</td>\n<td><strong>Tired</strong>, he sat down.</td>\n<td>Because he was tired</td>\n</tr>\n<tr>\n<td>条件</td>\n<td><strong>Given</strong> more time, we would stay.</td>\n<td>If we were given more time</td>\n</tr>\n<tr>\n<td>时间</td>\n<td><strong>Seen</strong> from above, the lake is blue.</td>\n<td>When it is seen from above</td>\n</tr>\n<tr>\n<td>伴随</td>\n<td>He walked away, <strong>followed by his dog</strong>.</td>\n<td>and was followed by his dog</td>\n</tr>\n</tbody>\n</table>\n<ol>\n<li>-ed 状语与主句主语构成被动关系</li>\n<li>可扩展为 \"being + done\"（正在被）或 \"having been done\"（已经被）</li>\n<li>\n<p>否定式 not done / not having been done</p>\n</li>\n<li>\n<p>逻辑主语不一致：<strong>Seen</strong> from the top, the valley looks like a map.（√，valley 是被看的）／<strong>Seeing</strong> from the top, the valley...（×）</p>\n</li>\n<li>该用 -ing 却用 -ed：<strong>Walking</strong> in the forest, I saw a deer.（√，I 主动走）</li>\n<li>\n<p>完成式遗漏：<strong>Having finished</strong> the track, we rested.（√）</p>\n</li>\n<li>\n<p><strong><em>_</em></strong>_ (give) a map, we found the way easily. → <strong>Given</strong></p>\n</li>\n<li><strong><em>_</em></strong>_ (follow) by a guide, the tourists felt safe. → <strong>Followed</strong></li>\n<li>改错：Seeing from the hill, the city is beautiful. → <strong>Seen from the hill, the city is beautiful.</strong></li>\n</ol>\n<h3>✍️ 写作：旅行故事（travel tale）</h3>\n<p><strong>结构</strong>：出发（时间地点）→ 途中（2–3 个事件，含一个转折）→ 感受与收获</p>\n<ol>\n<li><strong>It was a trip I will never forget.</strong> 这是一次我永远不会忘记的旅行。</li>\n<li><strong>We set off at dawn, ...</strong> 我们黎明出发，……</li>\n<li><strong>Just as we..., something unexpected happened.</strong> 就在我们……时，意外发生了。</li>\n<li><strong>Tired but excited, we...</strong> 疲惫但兴奋，我们……</li>\n<li><strong>Looking back, I realize that...</strong> 回头看，我意识到……</li>\n</ol>\n<h3>📖 阅读技能：梳理游记时间线</h3>\n<p>游记按时间推进：先找<strong>时间标志词</strong>（at dawn, later, by noon, finally），再找<strong>地点变化</strong>（moved on to, arrived at）。转折处（but, however, suddenly）往往是故事重点，也是考题常设处。</p>\n<h3>例题 1 · L1 词汇</h3>\n<p>用方框中的词填空：guideline / track / enthusiasm / conservation / escape</p>\n<ol>\n<li>The hikers followed a narrow ______ up the mountain.</li>\n<li>Wildlife ______ is important for the planet.</li>\n<li>She talked about the trip with great ______.</li>\n<li>The bird managed to ______ from the cage.</li>\n<li>Please read the safety ______ before you start.</li>\n</ol>\n<p><strong>解析</strong>：1. track　2. conservation　3. enthusiasm　4. escape　5. guidelines</p>\n<p><strong>💥 陷阱</strong>：第 5 题 guideline 常用复数 guidelines。</p>\n<p><strong>变式</strong>：用 do harm to 造句，表达\"乱扔垃圾会伤害野生动物\"。→ Littering can do harm to wildlife.</p>\n<h3>例题 2 · L2 语法</h3>\n<p>用 -ed 形式改写：\n1. Because he was tired, he stopped walking.\n2. If we were given more time, we would explore the valley.\n3. When it is seen from the top, the village looks tiny.</p>\n<p><strong>解析</strong>：\n1. <strong>Tired</strong>, he stopped walking.\n2. <strong>Given</strong> more time, we would explore the valley.\n3. <strong>Seen</strong> from the top, the village looks tiny.</p>\n<p><strong>💥 陷阱</strong>：第 3 题用 Seeing（主动）导致逻辑主语错误。</p>\n<p><strong>变式</strong>：用 \"followed by\" 造句：The guide walked ahead, followed by six tourists.</p>\n<h3>例题 3 · L3 翻译</h3>\n<p>翻译下列句子：\n1. 沿着山间小路走，我们看到了许多在城市里见不到的鸟。\n2. 受到当地人的热情鼓舞，我们决定多留两天。\n3. 回头看这次旅行，我意识到真正的收获不是照片，而是对自然的新认识。</p>\n<p><strong>参考译文</strong>：\n1. <strong>Walking</strong> along the mountain <strong>track</strong>, we saw many birds that cannot be seen in the city.\n2. <strong>Encouraged by</strong> the local people's <strong>enthusiasm</strong>, we decided to stay two more days.\n3. <strong>Looking back on</strong> the trip, I realize the real <strong>gain</strong> was not photos but a new understanding of nature.</p>\n<p><strong>采分点</strong>：① -ing 作状语 + 定语从句；② -ed 作状语（Encouraged by）；③ look back on + not...but...</p>\n<p><strong>💥 陷阱</strong>：第 1 句用 Walked（被动）导致逻辑主语错误；第 2 句 encourage 后介词用成 with。</p>\n<p><strong>变式</strong>：把第 3 句改为强调句：It is not photos but a new understanding of nature that is the real gain.</p>\n<h3>⏱️ 限时挑战（60 秒）</h3>\n<p>① -ed 作状语的条件？② \"Seen from here\" 的逻辑主语？③ 游记中的转折词有哪些？</p>\n<blockquote>\n<p>答案：① 与主句主语构成被动关系　② 主句主语（被看的事物）　③ but, however, suddenly</p>\n</blockquote>\n<h3>✅ 接下来做什么</h3>\n<ul>\n<li><strong>3 道全对</strong> → 进入选择性必修一；词汇直接默写\"本单元必背 10 词\"。</li>\n<li><strong>对 2 道</strong> → 重读\"语法\"与\"写作\"，再做例题 2、3。</li>\n<li><strong>对 0–1 道</strong> → 从\"核心词汇\"顺序读到例题 3，再背词表。</li>\n</ul>\n<blockquote>\n<p><strong>过关线</strong>：期中做到例题 2｜期末做到例题 3 和变式。</p>\n</blockquote>\n<h3>🧠 本单元必背 10 词</h3>\n<p>guideline, track, enthusiasm, conservation, escape, highlight, concept, specific, harm, engage</p>"}], "vocab": [["digital", "adj.", "数字信息系统的；数码的；数字式的", 1, 1, 0], ["typical", "adj.", "典型的；有代表性的；不出所料的；特有的", 1, 1, 0], ["event", "n.", "发生的事情；（尤指）重要的事情，大事", 1, 1, 0], ["onto", "prep.", "（与动词连用，表示朝某处或某位置运动）向，朝", 1, 1, 0], ["midnight", "n.", "子夜；午夜", 1, 1, 0], ["routine", "n.", "常规；正常顺序", 1, 1, 1], ["scene", "n.", "场面；片段；镜头；（尤指不愉快事情发生的）地点，现场", 1, 1, 0], ["earn", "v.", "挣得；赚得；挣钱", 1, 1, 0], ["death", "n.", "死亡；死", 1, 1, 0], ["button", "n.", "扣子；纽扣", 1, 1, 0], ["type", "n.", "类型；种类", 1, 1, 0], ["unique", "adj.", "独特的；唯一的", 1, 1, 0], ["respond", "v.", "反应", 1, 1, 0], ["select", "v.", "选择；挑选", 1, 1, 0], ["organization", "n.", "机构；团体；组织", 1, 1, 0], ["goal", "n.", "目标；目的", 1, 1, 0], ["partner", "n./v.", "搭档；同伴；配偶；结成伙伴", 1, 1, 0], ["improve", "v.", "（使）改进；（使）改善", 1, 1, 0], ["currently", "adv.", "当前；现在", 1, 1, 0], ["schedule", "n.", "工作计划；日程安排", 1, 1, 0], ["conference", "n.", "会议", 1, 1, 0], ["quality", "n.", "质量；品质", 1, 1, 0], ["deliver", "v.", "给予；递送", 1, 1, 0], ["inspire", "v.", "激励；鼓舞", 1, 1, 0], ["tip", "n.", "指点；实用的提示", 1, 1, 0], ["acquire", "v.", "获得；习得", 1, 1, 0], ["challenge", "n.", "挑战", 1, 1, 0], ["volunteer", "n./v.", "义务工作者；志愿者；自愿做；义务做", 1, 1, 0], ["location", "n.", " <script>
const $ = s => document.querySelector(s);
const KEY = 'dsh-eng-vocab-v1';
let marks = JSON.parse(localStorage.getItem(KEY) || '{}');
const save = () => localStorage.setItem(KEY, JSON.stringify(marks));
const vkey = i => 'v' + i;

function buildTree(){
  const t = $('#tree'); t.innerHTML='';
  let last='';
  DATA.cards.forEach((c,idx)=>{
    if(c.book!==last){ last=c.book;
      const b=document.createElement('div'); b.className='tree-book'; b.textContent=c.book; t.appendChild(b); }
    const el=document.createElement('div'); el.className='item'; el.dataset.idx=idx;
    el.innerHTML='<span class="id">'+c.id+'</span><span>'+c.name+'</span>';
    el.onclick=()=>open(idx); t.appendChild(el);
  });
}
function open(idx){
  const c=DATA.cards[idx];
  $('#content').innerHTML='<div class="card"><h2>'+c.id+'　'+c.name+'</h2>'+c.html+'</div>';
  $('#content').scrollTop=0;
  document.querySelectorAll('.item').forEach(e=>e.classList.toggle('on',+e.dataset.idx===idx));
}
function setView(v){
  $('#content').style.display = v==='card'?'block':'none';
  $('#vocab').style.display = v==='vocab'?'block':'none';
  $('#print').style.display = v==='print'?'block':'none';
  document.querySelectorAll('.tab[data-v]').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  if(v==='print') buildPrint();
}
function buildPrint(){
  if($('#print').dataset.done) return;
  let out='', last='';
  DATA.cards.forEach(c=>{
    if(c.book!==last){ if(last) out+='</div>'; last=c.book;
      out+='<div class="pbook"><h1>'+c.book+'</h1>'; }
    out+='<article class="pcard"><h2>'+c.id+'　'+c.name+'</h2>'+c.html+'</article>';
  });
  if(last) out+='</div>';
  $('#print').innerHTML=out; $('#print').dataset.done='1';
}
// ---- 词汇 ----
const V = DATA.vocab;
function countMarks(i){ return (marks[vkey(i)]||'').split('').filter(x=>x==='1').length; }
function initFilters(){
  const fb=$('#fbook'), fu=$('#funit');
  const books=[...new Set(V.map(v=>v[3]))].sort((a,b)=>a-b);
  books.forEach(b=>fb.innerHTML+='<option value="'+b+'">'+['','必修一','必修二','必修三','选必一','选必二','选必三','选必四'][b]+'</option>');
  DATA.units.forEach(u=>fu.innerHTML+='<option value="'+u.id+'">'+u.book+' U'+u.unit+' '+u.title+'</option>');
}
function renderVocab(){
  const b=$('#fbook').value, u=$('#funit').value, st=$('#fstate').value, q=$('#fq').value.trim().toLowerCase();
  const body=$('#vbody'); body.innerHTML='';
  let shown=0, done=0, total=0;
  V.forEach((v,i)=>{
    total++;
    const n=countMarks(i); if(n>=5) done++;
    if(b && String(v[3])!==b) return;
    if(u && ('E-'+v[3]+'.'+v[4])!==u) return;
    if(st==='0' && n>=5) return;
    if(st==='5' && n<5) return;
    if(q && !(v[0].toLowerCase().includes(q)||v[2].includes(q))) return;
    shown++;
    const tr=document.createElement('tr');
    let boxes='';
    for(let k=0;k<5;k++){
      const on=((marks[vkey(i)]||'')||'').padStart(5,'0')[k]==='1';
      boxes+='<span class="bx'+(on?' on':'')+'" data-i="'+i+'" data-k="'+k+'"></span>';
    }
    tr.innerHTML='<td class="w-en"><b>'+v[0]+'</b>'+(v[5]?'<span class="tag">★</span>':'')+'</td>'+
      '<td class="pos">'+v[1]+'</td><td>'+boxes+'</td><td class="cn">'+v[2]+'</td>'+
      '<td class="pos">'+v[3]+'.'+v[4]+'</td>';
    body.appendChild(tr);
  });
  $('#vstat').textContent='显示 '+shown+' 词 ｜ 已背完 '+done+' / '+total;
  document.querySelectorAll('.bx').forEach(el=>el.onclick=()=>{
    const i=el.dataset.i, k=+el.dataset.k;
    let s=(marks[vkey(i)]||'').padStart(5,'0').split('');
    s[k]=s[k]==='1'?'0':'1'; marks[vkey(i)]=s.join(''); save();
    el.classList.toggle('on');
    renderVocab();
  });
}
$('#fbook').onchange=()=>{ $('#funit').value=''; renderVocab(); };
$('#funit').onchange=renderVocab; $('#fstate').onchange=renderVocab; $('#fq').oninput=renderVocab;
$('#hideCn').onclick=()=>{ $('#vocab').classList.toggle('hide-cn'); $('#hideCn').classList.toggle('on'); };
$('#hideEn').onclick=()=>{ $('#vocab').classList.toggle('hide-en'); $('#hideEn').classList.toggle('on'); };
$('#random').onclick=()=>{
  const pool=V.map((v,i)=>({v,i})).filter(x=>countMarks(x.i)<5);
  pool.sort(()=>Math.random()-0.5);
  const pick=new Set(pool.slice(0,20).map(x=>x.i));
  $('#fbook').value=''; $('#funit').value=''; $('#fstate').value=''; $('#fq').value='';
  renderVocab();
  document.querySelectorAll('#vbody tr').forEach((tr,idx)=>{});
  const body=$('#vbody'); body.innerHTML='';
  [...pick].forEach(i=>{ const v=V[i]; const tr=document.createElement('tr');
    tr.innerHTML='<td class="w-en"><b>'+v[0]+'</b></td><td class="pos">'+v[1]+'</td><td>随机</td><td class="cn">'+v[2]+'</td><td class="pos">'+v[3]+'.'+v[4]+'</td>';
    body.appendChild(tr); });
  $('#vstat').textContent='随机 20 词（从未背完的词中抽）';
};
document.querySelectorAll('.tab').forEach(b=>{ if(b.dataset.v) b.onclick=()=>setView(b.dataset.v); });
initFilters(); buildTree(); renderVocab();
(function(){
  const h=location.hash;
  if(h.startsWith('#v')) setView('vocab');
  const m=h.match(/^#c=(.+)$/);
  if(m){ const i=DATA.cards.findIndex(c=>c.id===decodeURIComponent(m[1])); if(i>=0) open(i); }
})();
$('#stat').textContent = DATA.cards.length + ' 个单元 · ' + V.length + ' 个词条';
$('#fname').textContent = DATA.cards.length + ' 单元 / ' + V.length + ' 词';
</script>
</body></html>
